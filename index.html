<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="only light" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Morgan's Kitchen">
<link rel="manifest" href="/manifest.json">
<title>Morgan's Kitchen — what shall we cook?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: only light;
    --paper:#FBF6EC; --paper-2:#EFE6D2; --card:#FFFFFF;
    --ink:#211E18; --ink-soft:#5C564A;
    --herb:#3F5C3A; --herb-deep:#2E4429; --terra:#C2693F; --terra-soft:#E9C9B4;
    --line:#E6DCC7; --shadow:0 18px 40px -24px rgba(60,45,20,.45);
    --r:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* Force light mode on all iOS versions — 'transparent' in gradients becomes
     transparent-black in dark mode, so we replace it with rgba of --paper */
  html{
    color-scheme:only light;
    background:#FBF6EC;   /* explicit fallback so iOS never goes dark */
  }
  html,body{margin:0}
  body{
    font-family:'Hanken Grotesk',sans-serif;color:#211E18;
    background:
      radial-gradient(120% 80% at 80% -10%, #FAEAD3 0%, rgba(251,246,236,0) 60%),
      radial-gradient(90% 70% at -10% 110%, #EBF0E2 0%, rgba(251,246,236,0) 55%),
      #FBF6EC;
    min-height:100dvh;line-height:1.5;
  }
  /* Belt-and-suspenders: override any residual dark-mode UA stylesheet */
  @media (prefers-color-scheme: dark) {
    html,body{ background:#FBF6EC !important; color:#211E18 !important; }
    :root{ color-scheme:only light; }
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 18px 120px}
  .display{font-family:'Fraunces',serif;font-weight:500;letter-spacing:-.01em;line-height:1.05}
  .italic{font-style:italic}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  /* ---------- top bar / multi-ring goal tracker ---------- */
  header{position:sticky;top:0;z-index:30;backdrop-filter:blur(10px);
    background:linear-gradient(var(--paper),rgba(251,246,236,.86));
    border-bottom:1px solid var(--line)}
  .bar{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
  .brand{font-family:'Fraunces',serif;font-size:17px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
  .brand b{color:var(--herb)}
  .coach{margin-left:auto;display:flex;align-items:center;gap:9px;min-width:0;
    cursor:pointer;-webkit-tap-highlight-color:transparent}
  /* SVG rings */
  .rings-svg{flex-shrink:0;display:block}
  .rt{fill:none;stroke-width:6;stroke-opacity:.15}
  .rf{fill:none;stroke-width:6;stroke-linecap:round;
      transition:stroke-dashoffset .85s cubic-bezier(.4,0,.2,1)}
  /* ring legend stats */
  .coach-txt{text-align:right;display:flex;flex-direction:column;gap:2px}
  .hs{font-size:10.5px;font-weight:700;white-space:nowrap;line-height:1.35;letter-spacing:-.01em}
  .hs-cal{color:#E05C42}
  .hs-prot{color:#5E9E6B}
  .hs-fib{color:#4A90D9}
  .hs-wat{color:#4EC5D4}

  /* ---------- generic ---------- */
  .eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--terra);font-weight:700}
  .back{display:inline-flex;align-items:center;gap:8px;color:var(--herb-deep);font-weight:700;
    font-size:16px;margin:16px 0 4px;padding:12px 18px 12px 14px;background:var(--card);
    border:1.5px solid var(--line);border-radius:999px;box-shadow:0 2px 8px -4px rgba(60,45,20,.18);
    min-height:48px;-webkit-tap-highlight-color:transparent}
  .back:hover{color:var(--herb)}
  .fade{animation:fade .5s both}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .stagger>*{animation:fade .55s both}
  .stagger>*:nth-child(2){animation-delay:.06s}
  .stagger>*:nth-child(3){animation-delay:.12s}
  .stagger>*:nth-child(4){animation-delay:.18s}
  .stagger>*:nth-child(5){animation-delay:.24s}
  .stagger>*:nth-child(6){animation-delay:.30s}

  /* ---------- home ---------- */
  .hero{padding:46px 4px 8px}
  .hero h1{font-size:clamp(34px,8vw,52px);margin:.1em 0 .15em}
  .hero p{color:var(--ink-soft);font-size:16px;max-width:42ch;margin:0}
  .meals{display:grid;gap:14px;margin-top:28px}
  .meal{display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s;text-align:left;width:100%}
  .meal:hover{transform:translateY(-3px);box-shadow:0 26px 50px -26px rgba(60,45,20,.5)}
  .meal:active{transform:translateY(0)}
  .meal .em{font-size:30px;width:58px;height:58px;flex:none;display:grid;place-items:center;
    background:var(--paper-2);border-radius:16px}
  .meal h3{font-family:'Fraunces',serif;font-size:23px;font-weight:600;margin:0}
  .meal small{color:var(--ink-soft);font-size:13.5px}
  .meal .arrow{margin-left:auto;color:var(--herb);font-size:22px}
  /* ── load-from-url ── */
  .url-section{margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}
  .url-section .eyebrow{margin-bottom:8px}
  .url-row{display:flex;gap:10px}
  .url-input{flex:1;min-width:0;padding:13px 14px;border:1.5px solid var(--line);
    border-radius:14px;font-size:15px;font-family:inherit;background:var(--card);
    color:var(--ink);outline:none;-webkit-appearance:none}
  .url-input:focus{border-color:var(--herb)}
  .url-input::placeholder{color:var(--ink-soft)}
  /* ── Spin-to-cook slot machine ── */
  .slot-section{margin-top:18px}
  .slot-open{width:100%;display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,#3F5C3A,#2E4429);
    color:#FDF8EE;border:none;border-radius:18px;padding:18px 20px;font-size:1.05rem;cursor:pointer;box-shadow:0 6px 18px rgba(46,68,41,.25)}
  .slot-open .em{font-size:1.7rem}
  .slot-open small{display:block;opacity:.75;font-size:.8rem}
  .reels{display:flex;gap:10px;margin:18px 0}
  .reel{flex:1;background:#fff;border:2px solid var(--line,#E8DCC8);border-radius:16px;padding:10px 8px;text-align:center;position:relative}
  .reel.locked{border-color:#C2693F;background:#FBF3EA}
  .reel .r-em{font-size:1.5rem}
  .reel select{width:100%;border:none;background:transparent;font-family:Georgia,serif;font-size:.95rem;color:#2E4429;text-align:center;text-align-last:center;margin-top:4px}
  .reel.spinning select{filter:blur(2px);transition:filter .1s}
  .reel .lockbtn{position:absolute;top:-10px;right:-6px;background:#fff;border:1px solid var(--line,#E8DCC8);border-radius:50%;width:30px;height:30px;font-size:.85rem;cursor:pointer}
  .spin-btn{width:100%;background:#C2693F;color:#fff;border:none;border-radius:16px;padding:16px;font-size:1.1rem;cursor:pointer;box-shadow:0 6px 16px rgba(194,105,63,.3)}
  .spin-btn:active{transform:scale(.98)}
  .slot-row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.05)}
  .slot-row .hit{font-size:.72rem;padding:4px 8px;border-radius:10px;white-space:nowrap}
  .hit-3{background:#E3EFD9;color:#2E4429}.hit-2{background:#FBF0E2;color:#9A5B2F}.hit-1{background:#F4EDE2;color:#8C8270}
  .slot-row .meta{font-size:.75rem;color:var(--ink-soft)}
  .url-go{width:50px;flex-shrink:0;border-radius:14px;background:var(--herb);
    color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;
    transition:background .15s}
  .url-go:hover{background:var(--herb-deep)}

  /* ---------- menu list ---------- */
  .menu-head{padding:6px 4px 18px}
  .menu-head h2{font-size:clamp(28px,6.5vw,40px);margin:.15em 0}
  .filter-bar{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 14px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-snap-type:x mandatory}
  .filter-bar::-webkit-scrollbar{display:none}
  .filter-bar .chip{flex:none;scroll-snap-align:start;font-size:13px;padding:7px 14px;white-space:nowrap}
  .chip-cnt{font-size:11px;font-weight:600;opacity:.65;margin-left:3px}
  /* ── Goals page ── */
  .g-card{background:var(--card);border-radius:20px;padding:20px;margin-bottom:12px;box-shadow:0 2px 12px -6px rgba(60,45,20,.14)}
  .g-row{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .g-ico{font-size:22px;line-height:1;flex-shrink:0}
  .g-lbl{font-size:14px;font-weight:700;flex:1;color:var(--ink)}
  .g-val{font-size:16px;font-weight:800}
  .g-of{font-size:12px;font-weight:500;color:var(--ink-soft)}
  .g-bar{height:9px;background:rgba(0,0,0,.07);border-radius:99px;overflow:hidden;margin:10px 0 14px}
  .g-fill{height:100%;border-radius:99px;transition:width .5s ease;background:var(--herb-deep)}
  .g-fill.over{background:var(--terra)}
  .g-field{display:flex;align-items:center;gap:8px}
  .g-field label{font-size:12px;color:var(--ink-soft);white-space:nowrap;flex-shrink:0}
  .g-num{width:88px;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;
          font-size:16px;font-family:inherit;background:var(--parchment);color:var(--ink);text-align:center}
  .g-unit{font-size:13px;color:var(--ink-soft)}
  .g-tip{font-size:11.5px;color:var(--ink-soft);margin-top:7px;font-style:italic;line-height:1.5}
  /* water reminder row */
  .reminder-row{display:flex;align-items:center;gap:12px;margin-top:12px;
    padding-top:12px;border-top:1px solid var(--line);justify-content:space-between}
  .reminder-row .lbl{font-size:14px;font-weight:600;margin-bottom:2px}
  .reminder-row .sub{font-size:11.5px;color:var(--ink-soft)}
  .time-pick{padding:7px 10px;border:1.5px solid var(--line);border-radius:10px;
    font-size:14px;font-family:inherit;background:var(--card);color:var(--ink);outline:none}
  .time-pick:focus{border-color:var(--herb)}
  .notif-toggle{padding:9px 18px;border-radius:999px;font-size:13px;font-weight:700;
    border:1.5px solid var(--line);background:var(--paper);color:var(--ink-soft);
    transition:background .2s,border-color .2s,color .2s;white-space:nowrap}
  .notif-toggle.on{background:var(--herb);color:#fff;border-color:var(--herb)}
  .g-sex-row{display:flex;gap:8px;margin:12px 0 4px}
  .g-sex{flex:1;padding:10px;border-radius:13px;font-size:13.5px;font-weight:700;
    border:1.5px solid var(--line);background:var(--paper);color:var(--ink-soft);cursor:pointer}
  .g-sex.active{background:var(--herb-deep);color:#fff;border-color:var(--herb-deep)}
  .g-stepper{display:flex;align-items:center;gap:0;margin:10px 0 6px;background:var(--parchment);border-radius:14px;overflow:hidden}
  .g-step{width:52px;height:52px;font-size:24px;font-weight:700;color:var(--herb-deep);flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .g-water-n{flex:1;text-align:center;font-size:32px;font-weight:800;line-height:1}
  .g-water-sub{display:block;font-size:11px;color:var(--ink-soft);margin-top:2px}
  .chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);
    background:var(--card);border-radius:999px;padding:9px 15px;font-weight:600;font-size:14px;transition:.15s}
  .chip[aria-pressed="true"]{border-color:var(--herb);background:var(--herb);color:#fff}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
  @media(max-width:520px){.cards{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
    box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s;text-align:left;display:flex;flex-direction:column}
  .card:hover{transform:translateY(-4px);box-shadow:0 28px 52px -26px rgba(60,45,20,.55)}
  .thumb{aspect-ratio:4/3;width:100%;object-fit:cover;background:linear-gradient(135deg,var(--paper-2),var(--terra-soft));display:block}
  .thumb-fallback{aspect-ratio:4/3;display:grid;place-items:center;font-family:'Fraunces',serif;
    font-size:34px;color:var(--herb-deep);background:linear-gradient(135deg,#EAF0DF,var(--terra-soft))}
  .card-body{padding:14px 15px 16px}
  .card h4{font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin:0 0 2px;line-height:1.15}
  .card .blog{color:var(--terra);font-size:12.5px;font-weight:700;text-transform:lowercase}
  .pills{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
  .pill{font-size:12px;font-weight:600;color:var(--ink-soft);background:var(--paper-2);
    border-radius:999px;padding:4px 10px;display:inline-flex;gap:5px;align-items:center}
  .pill.protein{background:#E7EFDD;color:var(--herb-deep)}

  /* ---------- recipe detail ---------- */
  .tabs{display:flex;gap:8px;margin:14px 0 4px}
  .tab{padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;background:var(--card);border:1.5px solid var(--line)}
  .tab[aria-selected="true"]{background:var(--herb-deep);color:#fff;border-color:var(--herb-deep)}
  .r-hero{position:relative;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);margin-top:6px}
  .r-hero img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
  .r-hero .grad{position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(20,15,8,.78))}
  .r-hero .cap{position:absolute;left:20px;right:20px;bottom:18px;color:#fff}
  .r-hero .cap .blog{color:#F3D9C6;font-weight:700;font-size:13px;text-transform:lowercase}
  .r-hero .cap h2{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(24px,6vw,34px);margin:2px 0 0;text-shadow:0 2px 18px rgba(0,0,0,.4)}
  .metarow{display:flex;gap:18px;flex-wrap:wrap;color:var(--ink-soft);font-size:13.5px;font-weight:600;margin:16px 2px 0}
  .metarow b{color:var(--ink)}
  .addbtn{width:100%;margin-top:18px;background:var(--herb);color:#fff;border-radius:14px;padding:15px;
    font-size:15.5px;font-weight:700;box-shadow:0 14px 26px -14px var(--herb);transition:.15s;display:flex;justify-content:center;gap:9px;align-items:center}
  .addbtn:hover{background:var(--herb-deep)}
  .addbtn.done{background:#E7EFDD;color:var(--herb-deep);box-shadow:none}
  /* log + heart row on recipe detail */
  .action-row{display:flex;gap:10px;align-items:stretch;margin-top:18px}
  .action-row .addbtn{flex:1;width:auto;margin-top:0;min-width:0}
  .detail-heart{width:54px;flex-shrink:0;border-radius:14px;border:1.5px solid var(--line);
    background:var(--card);font-size:24px;display:flex;align-items:center;
    justify-content:center;cursor:pointer;transition:background .15s,border-color .15s}
  .detail-heart.active{background:#FDECEA;border-color:#E07070}
  .detail-share{width:54px;flex-shrink:0;border-radius:14px;border:1.5px solid var(--line);
    background:var(--card);font-size:22px;display:flex;align-items:center;
    justify-content:center;cursor:pointer;transition:background .15s,border-color .15s}
  .detail-share:active{background:#EAF1E6;border-color:var(--herb)}
  .move-row{display:flex;gap:10px;flex-wrap:wrap}
  .move-btn{flex:1;min-width:90px;padding:13px 12px;border-radius:14px;border:1.5px solid var(--line);
    background:var(--card);font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer;
    transition:background .15s,border-color .15s}
  .move-btn:active{background:#EAF1E6;border-color:var(--herb)}
  .sec{margin-top:30px}
  .sec h3{font-family:'Fraunces',serif;font-size:22px;font-weight:600;margin:0 0 12px;display:flex;align-items:baseline;gap:10px}
  .sec h3 .n{font-size:13px;color:var(--terra);font-weight:700;letter-spacing:.12em}
  .serve-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px}
  .serve-note{font-size:12.5px;color:var(--ink-soft);margin-top:4px;max-width:38ch}
  .serve-row>div:first-child{flex:1;min-width:0}
  .serve-control{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px}
  .serve-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
  .scaler{display:inline-flex;align-items:center;flex:none;border:1.5px solid var(--line);border-radius:999px;background:var(--card);overflow:hidden}
  .scaler button{flex:none;width:42px;height:38px;font-weight:700;font-size:22px;line-height:1;color:var(--herb);display:grid;place-items:center}
  .scaler button:active{background:var(--paper-2)}
  .scaler #svCount{min-width:34px;padding:0 2px;text-align:center;font-weight:700;font-size:16px;white-space:nowrap}
  ul.ingredients{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
  ul.ingredients li{padding:12px 4px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;font-size:15.5px}
  ul.ingredients li::before{content:'';width:9px;height:9px;margin-top:8px;border-radius:50%;background:var(--terra-soft);border:2px solid var(--terra);flex:none}
  .steps{counter-reset:s;display:grid;gap:16px}
  .step{display:flex;gap:14px}
  .step .num{counter-increment:s;flex:none;width:32px;height:32px;border-radius:50%;background:var(--herb-deep);color:#fff;
    font-family:'Fraunces',serif;font-weight:600;display:grid;place-items:center}
  .step .num::before{content:counter(s)}
  .step p{margin:3px 0;font-size:15.5px}
  .grp-name{font-weight:700;color:var(--herb-deep);margin:6px 0 -4px;font-size:14px;text-transform:uppercase;letter-spacing:.05em}
  .video{position:relative;padding-top:56.25%;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);margin-top:6px}
  .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .nutri{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:520px){.nutri{grid-template-columns:repeat(2,1fr)}}
  .nutri div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center}
  .nutri .v{font-family:'Fraunces',serif;font-size:24px;font-weight:600}
  .nutri .v.hi{color:var(--herb)}
  .nutri .k{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;margin-top:2px;font-weight:600}
  .nutri div.fetching{animation:nutri-pulse 1.3s ease-in-out infinite}
  @keyframes nutri-pulse{0%,100%{opacity:.55}50%{opacity:1}}
  .leave{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:26px;
    border:1.5px solid var(--line);border-radius:14px;padding:14px;font-weight:600;color:var(--ink-soft);background:var(--card)}
  .leave:hover{color:var(--terra);border-color:var(--terra-soft)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(160%);
    background:var(--herb-deep);color:#fff;padding:13px 20px;border-radius:14px;font-weight:600;
    box-shadow:var(--shadow);transition:transform .35s cubic-bezier(.2,1.3,.5,1),opacity .25s;
    z-index:50;font-size:14.5px;opacity:0;visibility:hidden;pointer-events:none}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
  .nudge{background:#FBEFE6;border:1px solid var(--terra-soft);border-radius:14px;padding:14px 16px;
    margin:14px 0 2px;font-size:14.5px;color:#7a4a2c}

  /* ---------- bottom navigation ---------- */
  nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;
    gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    background:var(--paper);backdrop-filter:blur(12px);
    box-shadow:0 -8px 20px -8px rgba(0,0,0,.12);border-top:1px solid var(--line)}
  nav.tabbar button{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 4px;border-radius:14px;color:var(--ink-soft);font-weight:600;font-size:11.5px}
  nav.tabbar button .ic{font-size:19px;line-height:1}
  nav.tabbar button[aria-current="true"]{color:var(--herb-deep);background:#E7EFDD}

  /* ---------- larger screens: iPad & desktop ---------- */
  .plan-grid{display:grid;gap:14px}
  @media (min-width:740px){
    .wrap{max-width:920px;padding:0 30px 132px}
    .bar{max-width:920px;padding:12px 26px}
    .brand{font-size:20px}
    .hs{font-size:12px}
    .hero{padding:64px 6px 14px}
    .hero h1{font-size:clamp(40px,6vw,56px)}
    .hero p{font-size:18px;max-width:48ch}
    .meals{grid-template-columns:1fr 1fr;gap:18px}
    .cards{grid-template-columns:repeat(3,1fr);gap:18px}
    .plan-grid{grid-template-columns:1fr 1fr;gap:16px;align-items:start}
    .r-hero img{max-height:440px}
    .sec h3{font-size:24px}
    nav.tabbar{gap:10px}
    nav.tabbar button{font-size:13px;max-width:148px}
    nav.tabbar button .ic{font-size:22px}
  }
  @media (min-width:1024px){
    .wrap{max-width:1060px}
    .bar{max-width:1060px}
    .cards{grid-template-columns:repeat(3,1fr)}
  }

  /* ---------- Today / Week ---------- */
  .page-h{padding:24px 4px 6px}
  .page-h .eyebrow{margin-bottom:4px}
  .page-h h2{font-family:'Fraunces',serif;font-size:clamp(30px,7vw,42px);font-weight:600;margin:.05em 0}
  .summary{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);margin-top:8px}
  .summary .big{font-family:'Fraunces',serif;font-size:34px;font-weight:600;line-height:1}
  .summary .big small{font-size:16px;color:var(--ink-soft)}
  .summary .lbl{font-size:13px;color:var(--ink-soft);margin-top:3px}
  .pbar{height:10px;border-radius:999px;background:var(--paper-2);overflow:hidden;margin-top:10px}
  .pbar>div{height:100%;background:var(--herb);border-radius:999px;transition:width .5s}
  .meal-group{margin-top:22px}
  .meal-group h3{font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
  .meal-group h3 .sum{margin-left:auto;font-family:'Hanken Grotesk';font-size:13px;color:var(--herb-deep);font-weight:700}
  .logline{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:11px 14px;margin-bottom:8px}
  .logline .t{font-weight:600;font-size:14.5px}
  .logline .b{color:var(--terra);font-size:12px;font-weight:700}
  .logline .p{background:#E7EFDD;color:var(--herb-deep);font-weight:700;font-size:12.5px;
    border-radius:999px;padding:4px 10px;white-space:nowrap}
  .logline .course{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
  .logline .rm{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);
    background:var(--paper);color:var(--ink-soft);font-size:16px;font-weight:400;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
  .logline .rm:active{background:var(--terra-soft);border-color:var(--terra);color:var(--terra)}
  /* planned-but-not-yet-logged entries in Today */
  .logline.planned{background:var(--paper);border:1.5px dashed var(--line)}
  .logline.planned .b{color:var(--ink-soft)}
  .plan-tag{margin-left:auto;font-size:11px;font-weight:600;color:var(--ink-soft);
    background:var(--paper-2);border-radius:999px;padding:3px 10px;white-space:nowrap;flex-shrink:0}
  .empty{color:var(--ink-soft);font-size:14px;padding:6px 2px 2px;font-style:italic}
  .cook-cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:8px;
    background:var(--herb);color:#fff;border-radius:14px;padding:14px;font-weight:700;font-size:15px}
  .cook-cta:hover{background:var(--herb-deep)}
  /* weekly chart */
  .chart-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);padding:16px 14px 10px;margin-top:8px}
  .chart-wrap svg{width:100%;height:auto;display:block}
  .day-block{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .day-block .dh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
  .day-block .dh b{font-family:'Fraunces',serif;font-size:16px;font-weight:600}
  .day-block .dh .tot{margin-left:auto;font-size:13px;font-weight:700;color:var(--herb-deep)}
  .day-block .dh .tot.under{color:var(--terra)}
  .day-block .m{font-size:13.5px;color:var(--ink-soft);padding:2px 0}
  .day-block .m b{color:var(--ink);font-weight:600}

  /* plan picker on recipe */
  .planrow{display:flex;gap:8px;margin-top:10px}
  .planrow select{flex:1;border:1.5px solid var(--line);border-radius:14px;padding:0 12px;
    font:inherit;font-size:14.5px;font-weight:600;background:var(--card);color:var(--ink)}
  .planbtn{flex:none;border:1.5px solid var(--herb);color:var(--herb-deep);background:var(--card);
    border-radius:14px;padding:13px 16px;font-weight:700;font-size:14.5px}
  .planbtn:active{background:#E7EFDD}
  /* planner */
  .shop-btn{width:100%;margin-top:10px;background:var(--terra);color:#fff;border-radius:14px;
    padding:15px;font-weight:700;font-size:15.5px;box-shadow:0 14px 26px -16px var(--terra)}
  .shop-btn:hover{filter:brightness(.96)}
  /* export row */
  .export-row{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 16px;scrollbar-width:none}
  .export-row::-webkit-scrollbar{display:none}
  .exp-btn{flex:none;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;
           border:1.5px solid;white-space:nowrap;background:var(--card);
           -webkit-tap-highlight-color:transparent}
  .exp-share{color:var(--herb-deep);border-color:var(--herb-deep)}
  .exp-copy{color:var(--ink-soft);border-color:var(--line)}
  .exp-walmart{color:#0071CE;border-color:#0071CE}
  .exp-instacart{color:#2E7D32;border-color:#2E7D32}
  .plan-day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);padding:14px 16px;margin-top:14px}
  .pd-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
  .pd-head b{font-family:'Fraunces',serif;font-size:18px;font-weight:600}
  .pd-date{color:var(--ink-soft);font-size:12px}
  .pd-tot{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--herb-deep)}
  .pd-tot.under{color:var(--terra)}
  .day-nutri{display:flex;gap:0;flex-wrap:wrap;margin:5px 0 8px;font-size:12px;color:var(--ink-soft)}
  .day-nutri span{white-space:nowrap;padding-right:10px}
  .day-nutri span:not(:last-child)::after{content:"·";padding-left:10px;opacity:.4}
  .day-nutri b{color:var(--ink);font-weight:700}
  .plan-meal{margin-top:8px}
  .pm-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--terra);font-weight:700}
  .plan-item{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);
    border-radius:12px;padding:9px 12px;margin-top:5px}
  .plan-item .t{font-weight:600;font-size:14px}
  .plan-item .b{color:var(--ink-soft);font-size:11.5px}
  .pi-body{flex:1;min-width:0;cursor:pointer}
  .pi-body:active{opacity:.6}
  .plan-item .rm{margin-left:auto;flex:none;width:30px;height:30px;border-radius:50%;font-size:18px;
    color:var(--ink-soft);background:var(--card);border:1px solid var(--line);line-height:1}
  .plan-item .rm:active{background:#FBEFE6;color:var(--terra)}
  /* plan drag-and-drop */
  .drag-handle{flex:none;width:26px;height:30px;display:flex;align-items:center;justify-content:center;
    font-size:17px;color:var(--ink-soft);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;margin-left:-4px}
  .drag-handle:active{cursor:grabbing}
  .plan-item.drag-source{opacity:.35}
  .drag-ghost{position:fixed;z-index:9999;pointer-events:none;opacity:.95;
    box-shadow:0 10px 28px rgba(0,0,0,.18);transform:scale(1.02)}
  .plan-meal.empty-slot{display:none}
  .dragging .plan-meal.empty-slot{display:block}
  .drop-hint{display:none;border:1.5px dashed var(--line);border-radius:12px;padding:13px;
    text-align:center;color:var(--ink-soft);font-size:12px;margin-top:5px}
  .dragging .plan-meal.empty-slot .drop-hint{display:block}
  .plan-meal.drop-target{background:#EAF1E6;border-radius:14px;outline:2px solid var(--herb);outline-offset:2px}
  .dragging .plan-meal.drop-target .drop-hint{border-color:var(--herb);color:var(--herb)}
  .dragging .day-empty{display:none}
  .dragging nav.tabbar{pointer-events:none}
  /* shopping list */
  .shop-sec{margin-top:18px}
  .shop-sec h3{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin:0 0 8px;
    display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px}
  .shop-sec h3 span{font-family:'Hanken Grotesk';font-size:12px;color:#fff;background:var(--herb);
    border-radius:999px;padding:1px 9px;font-weight:700}
  .shop-item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);
    font-size:15.5px;cursor:pointer}
  .shop-item input{width:20px;height:20px;accent-color:var(--herb);flex:none}
  .shop-item.got span{text-decoration:line-through;color:var(--ink-soft)}
  /* ── search bar ──────────────────────────────────── */
  .search-wrap{position:relative;margin-bottom:14px;display:flex;gap:8px;align-items:center}
  .search-wrap .search-inner{flex:1;position:relative}
  .search-bar{width:100%;padding:13px 40px 13px 16px;border:1.5px solid var(--line);
    border-radius:16px;font-size:16px;font-family:inherit;background:var(--card);
    color:var(--ink);outline:none;-webkit-appearance:none;box-sizing:border-box;display:block}
  .search-bar:focus{border-color:var(--herb)}
  .search-bar::placeholder{color:var(--ink-soft)}
  .search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);
    font-size:20px;color:var(--ink-soft);background:none;border:none;
    width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  /* sort button + dropdown */
  .sort-wrap{position:relative;flex-shrink:0}
  .sort-btn{width:48px;height:48px;border-radius:14px;border:1.5px solid var(--line);
    background:var(--card);font-size:19px;display:flex;align-items:center;
    justify-content:center;transition:background .15s,border-color .15s}
  .sort-btn.on{background:var(--herb-deep);color:#fff;border-color:var(--herb-deep)}
  .sort-dd{position:absolute;top:calc(100% + 6px);right:0;min-width:210px;
    background:var(--card);border:1.5px solid var(--line);border-radius:16px;
    box-shadow:0 20px 40px -16px rgba(60,45,20,.35);overflow:hidden;z-index:200}
  .sort-opt{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;
    font-size:14.5px;text-align:left;font-weight:500;border-bottom:1px solid var(--line)}
  .sort-opt:last-child{border-bottom:none}
  .sort-opt.on{color:var(--herb-deep);font-weight:700}
  .sort-opt .sort-ck{margin-left:auto;font-size:13px;color:var(--herb)}
  /* ── recipe cards: image wrapper + heart ─────────── */
  .card-img-wrap{position:relative}
  .heart-btn{position:absolute;top:9px;right:9px;width:34px;height:34px;
    border-radius:50%;border:none;background:rgba(255,255,255,.88);
    font-size:17px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;z-index:2;box-shadow:0 2px 8px -2px rgba(0,0,0,.25);
    -webkit-tap-highlight-color:transparent;transition:transform .15s}
  .heart-btn:active{transform:scale(.85)}
  /* ── favourites filter chip ──────────────────────── */
  .chip.fav-active{background:var(--terra) !important;color:#fff !important;border-color:var(--terra) !important}
  /* ── recipe detail: log + heart row ─────────────── */
  .action-row{display:flex;gap:10px;align-items:stretch;margin-top:18px}
  .action-row .addbtn{flex:1;width:auto;margin-top:0;min-width:0}
  .detail-heart{width:54px;flex-shrink:0;border-radius:14px;border:1.5px solid var(--line);
    background:var(--card);font-size:24px;display:flex;align-items:center;
    justify-content:center;cursor:pointer;transition:background .15s,border-color .15s}
  .detail-heart.active{background:#FDECEA;border-color:#E07070}
  .detail-share{width:54px;flex-shrink:0;border-radius:14px;border:1.5px solid var(--line);
    background:var(--card);font-size:22px;display:flex;align-items:center;
    justify-content:center;cursor:pointer;transition:background .15s,border-color .15s}
  .detail-share:active{background:#EAF1E6;border-color:var(--herb)}
  .move-row{display:flex;gap:10px;flex-wrap:wrap}
  .move-btn{flex:1;min-width:90px;padding:13px 12px;border-radius:14px;border:1.5px solid var(--line);
    background:var(--card);font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer;
    transition:background .15s,border-color .15s}
  .move-btn:active{background:#EAF1E6;border-color:var(--herb)}
  /* ── recipe notes ────────────────────────────────── */
  .notes-sec{margin-top:28px}
  .notes-sec h3{font-family:'Fraunces',serif;font-size:22px;font-weight:600;margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
  .notes-area{width:100%;min-height:90px;padding:13px 15px;border:1.5px solid var(--line);
    border-radius:16px;font-size:15px;font-family:inherit;background:var(--card);
    color:var(--ink);resize:vertical;box-sizing:border-box;line-height:1.55;outline:none}
  .notes-area:focus{border-color:var(--herb)}
  .notes-area::placeholder{color:var(--ink-soft);font-style:italic}
  .notes-saved{font-size:11.5px;color:var(--herb-deep);margin-top:5px;opacity:0;transition:opacity .3s;font-style:italic}

  /* ── profile picker ──────────────────────────────────────────────────── */
  .ps-screen{min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:40px 24px;text-align:center}
  .ps-title{font-family:'Fraunces',serif;font-size:36px;font-weight:600;margin:14px 0 8px}
  .ps-sub{color:var(--ink-soft);font-size:14px;max-width:34ch;margin:0 auto 32px;line-height:1.55}
  .ps-list{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
  .ps-btn{display:flex;align-items:center;gap:16px;background:var(--card);
    border:1.5px solid var(--line);border-radius:18px;padding:16px 20px;
    box-shadow:var(--shadow);text-align:left;transition:transform .15s}
  .ps-btn:active{transform:scale(.97)}
  .ps-av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:19px;font-weight:800;color:#fff;flex-shrink:0}
  .ps-name{font-size:17px;font-weight:700;font-family:'Fraunces',serif}
  .ps-add-row{display:flex;gap:10px;width:100%;max-width:340px;margin-top:12px}
  .ps-add-input{flex:1;min-width:0;padding:13px 14px;border:1.5px solid var(--line);
    border-radius:14px;font-size:15px;font-family:inherit;background:var(--card);
    color:var(--ink);outline:none}
  .ps-add-input:focus{border-color:var(--herb)}
  .ps-add-btn{width:50px;flex-shrink:0;border-radius:14px;background:var(--herb);
    color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center}
  .profile-chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper-2);
    border-radius:999px;padding:4px 10px 4px 6px;font-size:12px;font-weight:700;
    cursor:pointer;border:1px solid var(--line)}
  .profile-chip .mini-av{width:20px;height:20px;border-radius:50%;display:flex;
    align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff}

</style>
</head>

<header>
  <div class="bar">

      <svg class="rings-svg" viewBox="0 0 76 76" width="68" height="68" aria-label="Daily nutrition rings">

function dayInfo(offset){            // offset 0 = today, -1 = yesterday ...
  const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+offset);
  const iso=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  return {iso, dow:d.toLocaleDateString(undefined,{weekday:"short"}),
          nice:d.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"}), dt:d};
}

function findRecipeByKey(key){
  for(const course of Object.keys(DEMO)){
    const r=(DEMO[course]||[]).find(r=>recipeKey(r)===key);
    if(r) return r;
  }
  return S.library?.[key] || S.savedRecipes?.[key] || S.favouriteRecipes?.[key] || null;
}

// ── Serialisation ────────────────────────────────────────────────────────────
function serialPersonal(){
  return {bw:S.bw, log:S.log, goals:S.goals, waterToday:S.waterToday, favourites:[...S.favourites], favouriteRecipes:S.favouriteRecipes, notes:S.notes};
}
function serialShared(){
  const planClean={};
  Object.entries(S.plan).forEach(([day,meals])=>{
    planClean[day]={};
    Object.entries(meals).forEach(([m,list])=>{
      planClean[day][m]=(list||[]).map(({recipe,...rest})=>rest);
    });
  });
  // Persist full snapshots for every recipe referenced by the plan, so plan
  // items always reopen after reload/sync — including URL-loaded recipes that
  // exist nowhere else. Pruned to current plan keys so it can't grow forever.
  const refKeys=new Set();
  Object.values(S.plan).forEach(meals=>Object.values(meals||{}).forEach(list=>(list||[]).forEach(e=>refKeys.add(e.key))));
  const savedClean={};
  refKeys.forEach(k=>{ if(S.savedRecipes[k]) savedClean[k]=S.savedRecipes[k]; });
  return {plan:planClean, savedRecipes:savedClean, library:S.library, shopChecked:[...S.shopChecked], mealMoves:S.mealMoves, movedRecipes:S.movedRecipes};
}

function applyPersonal(data){
  if(!data||typeof data!=="object") return;
  if(data.bw){ S.bw=+data.bw; }
  if(data.log) S.log=data.log;
  if(data.waterToday) S.waterToday=data.waterToday;
  if(data.favourites)        S.favourites=new Set(data.favourites);
  if(data.favouriteRecipes)  Object.assign(S.favouriteRecipes, data.favouriteRecipes);
  if(data.notes)      Object.assign(S.notes,data.notes);
  if(data.goals)      Object.assign(S.goals,data.goals);
  S.added=new Set((S.log[today()]||[]).map(e=>e.key));
}
function applyShared(data){
  if(!data||typeof data!=="object") return;
  if(data.shopChecked) S.shopChecked=new Set(data.shopChecked);
  if(data.mealMoves)    Object.assign(S.mealMoves, data.mealMoves);
  if(data.movedRecipes) Object.assign(S.movedRecipes, data.movedRecipes);
  if(data.savedRecipes) S.savedRecipes={...S.savedRecipes, ...data.savedRecipes};
  if(data.library) S.library=data.library;
  if(data.plan){
    S.plan={};
    Object.entries(data.plan).forEach(([day,meals])=>{
      S.plan[day]={};
      Object.entries(meals||{}).forEach(([m,list])=>{
        S.plan[day][m]=(list||[]).map(e=>({...e,recipe:findRecipeByKey(e.key)}));
      });
    });
  }
}

let _saveTimer=null;
function save(){
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>{
    const profile=getProfile(); if(!profile) return;
    const personal=serialPersonal(), shared=serialShared();
    try{ localStorage.setItem("mk_personal_"+profile, JSON.stringify(personal)); }catch{}
    try{ localStorage.setItem("mk_shared", JSON.stringify(shared)); }catch{}
    if(API!==null){
      fetch(`/api/state/${encodeURIComponent(profile)}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(personal)}).catch(()=>{});
      fetch("/api/state/shared",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(shared)}).catch(()=>{});
    }
  },300);
}

async function loadState(){
  const profile=getProfile(); if(!profile) return;

  // ── INSTANT: Apply localStorage right now (no server wait) ───────────────
  const localPersonal = localStorage.getItem("mk_personal_"+profile);
  if(localPersonal){ try{ applyPersonal(JSON.parse(localPersonal)); }catch{} }
  const localShared   = localStorage.getItem("mk_shared");
  if(localShared){   try{ applyShared(JSON.parse(localShared));   }catch{} }

  // ── BACKGROUND: Sync with server without blocking the UI ─────────────────
  if(API!==null){
    // Personal: only pull from server when localStorage is empty
    // (prevents a freshly-deployed/wiped server from overwriting good local data)
    if(!localPersonal){
      fetch(`/api/state/${encodeURIComponent(profile)}`)
        .then(r=>r.ok?r.json():null)
        .then(d=>{ if(d&&Object.keys(d).length>0){
          applyPersonal(d);
          localStorage.setItem("mk_personal_"+profile,JSON.stringify(d));
          refreshCoach();
        }}).catch(()=>{});
    }
    // Shared plan: always refresh so both phones see the same plan
    fetch("/api/state/shared")
      .then(r=>r.ok?r.json():null)
      .then(d=>{ if(d&&Object.keys(d).length>0){
        applyShared(d);
        localStorage.setItem("mk_shared",JSON.stringify(d));
        if(S.view==="plan") renderPlan();
      }}).catch(()=>{});
  }
}

/* ---------------- multi-ring goal tracker ---------------- */
function refreshCoach(){
  S.bw = S.bw||140;
  const g=goal(), n=nutritionSumToday();
  const water=(S.waterToday||{})[today()]||0;
  const gg=S.goals||{};
  // circumference for each ring radius [35,26,17,8]
  const rings=[
    ["rCal",  n.calories, gg.calories||2000, 219.9],
    ["rProt", n.protein,  g,                 163.4],
    ["rFib",  n.fiber,    gg.fiber||28,       106.8],
    ["rWat",  water,      gg.water||8,        50.3 ],
  ];
  rings.forEach(([id,actual,tgt,C])=>{
    const el=$(id); if(!el) return;
    const pct=Math.min(100, actual/Math.max(1,tgt)*100);
    el.style.strokeDashoffset = (C*(1-pct/100)).toFixed(2);
  });
  const fmt=v=>Math.round(v);
  if($("hCal"))  $("hCal").textContent  = `${fmt(n.calories)} / ${gg.calories||2000} cal`;
  if($("hProt")) $("hProt").textContent = `${fmt(n.protein)} / ${g}g prot`;
  if($("hFib"))  $("hFib").textContent  = `${fmt(n.fiber)} / ${gg.fiber||28}g fiber`;
  if($("hWat"))  $("hWat").textContent  = `${water} / ${gg.water||8} 💧`;
}

/* ---------------- data access ---------------- */
// Apply household recategorizations: drop recipes moved out of `course`,
// pull in recipes moved into `course` from other categories.
function applyMealMoves(course, list){
  const moves = S.mealMoves||{};
  // Drop anything reassigned to a different meal
  let out = list.filter(r=>{
    const t = moves[recipeKey(r)];
    return !t || t===course;
  });
  const have = new Set(out.map(r=>recipeKey(r)));
  // Pull in recipes assigned to this course from elsewhere
  for(const [key,target] of Object.entries(moves)){
    if(target!==course || have.has(key)) continue;
    let found=null;
    for(const m of ["breakfast","lunch","dinner","salad"]){
      const hit=(DEMO[m]||[]).find(r=>recipeKey(r)===key);
      if(hit){ found=hit; break; }
    }
    if(!found && S.movedRecipes?.[key]) found=S.movedRecipes[key];
    if(found){ out=[found,...out]; have.add(key); }
  }
  return out;
}

function libraryFor(course){
  return Object.values(S.library||{}).filter(r=>(r.course||"dinner")===course);
}
async function getMenu(course){
  const demo = applyMealMoves(course, [...libraryFor(course), ...(DEMO[course]||[])]);
  if(API === null) return demo;

  // Return DEMO immediately — never block the UI waiting for the server.
  // Kick off a background fetch; when it arrives, merge new images / recipes quietly.
  fetch(`/api/menu/${course}`)
    .then(r=>r.ok?r.json():null)
    .then(fresh=>{
      if(!Array.isArray(fresh)||!fresh.length) return;
      window._serverAnswered = true; // server is alive — photo-hiding may apply now
      if(S.meal!==course||!document.getElementById("cards")) return; // navigated away

      // Enrich DEMO recipes with server-fetched images
      const serverImg  = new Map(fresh.map(r=>[r.source_url, r.image||r.thumb||""]));
      const enriched   = demo.map(r=>
        (!r.image && r.source_url && serverImg.has(r.source_url))
          ? {...r, image: serverImg.get(r.source_url)} : r);

      // Only add scraped recipes from blogs NOT behind Cloudflare.
      // Cloudflare-blocked blogs return stubs (no ingredients/nutrition) that
      // fail to load when opened — flooding the count with broken recipes.
      const CLOUDFLARE_BLOGS = new Set([
        'eatingbirdfood','themediterraneandish','skinnytaste',
        'detoxinista','pinchofyum','theeastcoastkitchen'
      ]);
      const demoURLs   = new Set(demo.map(r=>r.source_url||r.title));
      const demoTitles = new Set(demo.map(r=>r.title.toLowerCase().trim()));
      const newOnly    = fresh.filter(r=>
        r.title &&  // skip image-only stubs from the backfill
        !demoURLs.has(r.source_url||r.title) &&
        !demoTitles.has((r.title||"").toLowerCase().trim()) &&
        ((r.ingredients||[]).length > 0 || !CLOUDFLARE_BLOGS.has(r.blog||""))
      );
      const merged     = [...enriched, ...newOnly];

      // Silently update the displayed list
      S.fullMenuList = merged;
      if(_menuMem[course]) _menuMem[course].list = merged;
      applyFilters(); // re-renders cards with any new images / extra recipes
      // The chip bars (favourites/new + blogs + protein counts) were built from
      // the instant local list — rebuild them now that the full list is in, so
      // counts don't sit stale until a chip is tapped.
      refreshFavChip();
      refreshProteinBar();
    })
    .catch(()=>{});

  return demo; // instant
}
function recipeKey(r){return (r.source_url||r.title);}

/* ---------------- meal plan ---------------- */
function planEntry(r,meal,servings){
  return {key:recipeKey(r), title:r.title, blog:r.blog, protein:r.nutrition?.protein_g||0,
          meal, servings:servings||r.servings||1, recipe:r};
}
function addToPlan(){
  const r=S.picks[S.course]; if(!r) return;
  const day=$("planDay") ? $("planDay").value : today();
  const meal=S.meal||"dinner";
  S.plan[day]=S.plan[day]||{};
  S.plan[day][meal]=S.plan[day][meal]||[];
  if(S.plan[day][meal].some(e=>e.key===recipeKey(r))){ toast("Already in the plan"); return; }
  S.plan[day][meal].push(planEntry(r,meal,S.servings));
  S.savedRecipes[recipeKey(r)] = r; // persist the full recipe so it always reopens (incl. URL-loaded ones)
  const lbl=$("planDay")?$("planDay").selectedOptions[0].textContent:"the plan";
  toast(`Added to ${lbl} 🗓️`); save();
}
function removeFromPlan(day,meal,key){
  if(S.plan[day]&&S.plan[day][meal]) S.plan[day][meal]=S.plan[day][meal].filter(e=>e.key!==key);
  save(); go("plan");
}
function plannedProtein(iso){
  const d=S.plan[iso]; if(!d) return 0;
  return ["breakfast","lunch","dinner","salad"].reduce((s,m)=>s+(d[m]||[]).reduce((a,e)=>a+e.protein,0),0);
}
function plannedNutrition(iso){
  const d=S.plan[iso]; if(!d) return null;
  let cal=0,prot=0,carbs=0,fat=0,fiber=0;
  ["breakfast","lunch","dinner","salad"].forEach(m=>{
    (d[m]||[]).forEach(e=>{
      const n=e.recipe?.nutrition||{};
      const base=e.recipe?.servings||1, sv=e.servings||1, f=sv/base;
      cal   += (n.calories   ||0)*f;
      prot  += (n.protein_g  ||0)*f;
      carbs += (n.carbs_g    ||0)*f;
      fat   += (n.fat_g      ||0)*f;
      fiber += (n.fiber_g    ||0)*f;
    });
  });
  if(!cal&&!prot&&!carbs&&!fat&&!fiber) return null;
  return {cal:Math.round(cal),prot:Math.round(prot),carbs:Math.round(carbs),fat:Math.round(fat),fiber:Math.round(fiber)};
}

/* ---------------- shopping list ---------------- */
/* ================================================================
   SHOPPING LIST — ingredient parsing, merging, display
================================================================ */

// Units that are real measurements (not adjectives like large/medium/small)
const UNIT_SET=new Set(["cups","cup","tablespoons","tablespoon","tbsp","teaspoons","teaspoon","tsp",
  "ounces","ounce","oz","pounds","pound","lbs","lb","grams","gram","kg","ml","liters","liter","l",
  "cans","can","cloves","clove","slices","slice","bunches","bunch","blocks","block","scoops","scoop",
  "packages","package","jars","jar","heads","head","sprigs","sprig","stalks","stalk",
  "pinches","pinch","handfuls","handful","fillets","fillet"]);

// Normalise unit variants → one canonical singular form used as the merge key
const UNIT_NORM={cups:"cup",tablespoons:"tbsp",tablespoon:"tbsp",teaspoons:"tsp",teaspoon:"tsp",
  ounces:"oz",ounce:"oz",pounds:"lb",pound:"lb",lbs:"lb",grams:"g",gram:"g",
  liters:"l",liter:"l",cans:"can",cloves:"clove",slices:"slice",bunches:"bunch",
  blocks:"block",scoops:"scoop",packages:"package",jars:"jar",heads:"head",
  sprigs:"sprig",stalks:"stalk",pinches:"pinch",handfuls:"handful",fillets:"fillet"};
function unitNorm(u){return UNIT_NORM[u]||u;}

// Pluralise a unit for display when qty > 1
function unitDisplay(u,qty){
  if(!u) return "";
  if(qty<=1) return u;   // "1/4 cup" and "1 cup" stay singular; "1 1/2 cups" and "2 cups" plural
  return ({cup:"cups",can:"cans",clove:"cloves",slice:"slices",bunch:"bunches",block:"blocks",
    scoop:"scoops",package:"packages",jar:"jars",head:"heads",sprig:"sprigs",stalk:"stalks",
    fillet:"fillets",pinch:"pinches",handful:"handfuls"})[u]||u; // tbsp/tsp/oz/lb/g unchanged
}

// Singularise a name for the merge key only (display uses the original)
function singular(n){
  if(!n) return n;
  if(n.endsWith("ies") && n.length>4) return n.slice(0,-3)+"y";  // berries→berry
  if(n.endsWith("oes") && n.length>4) return n.slice(0,-2);      // tomatoes→tomato
  if(n.endsWith("ves") && n.length>4) return n.slice(0,-3)+"f";  // leaves→leaf
  if(n.endsWith("s")  && !n.endsWith("ss") && n.length>3) return n.slice(0,-1);
  return n;
}

// Uncountable/mass nouns that never get an "s" appended
const UNCOUNTABLE=/^(milk|oil|water|broth|stock|vinegar|honey|syrup|rice|quinoa|pasta|flour|sugar|butter|cream|hummus|pesto|marinara|tamari|soy|garlic|feta|parmesan|mozzarella|cottage cheese|yogurt|dressing|seasoning|spinach|kale|arugula|coleslaw|ginger|tahini|protein powder|almond flour|cinnamon|paprika|cumin|oregano|vanilla|salt|pepper|baking|chicken|turkey|beef|salmon|tuna|tofu|tempeh|edamame|peanut butter|almond butter|basil|parsley|dill|thyme|oats|chia|olive oil|sesame oil|coconut oil|avocado oil)\b/;

// Pluralise a display name when there's no unit and qty > 1
function pluralName(name,qty){
  if(qty<=1||UNCOUNTABLE.test(name)) return name;
  if(name.endsWith("berry")) return name.slice(0,-5)+"berries";
  if(name.endsWith("tomato")||name.endsWith("potato")) return name+"es";
  if(name.endsWith("y") && !/[aeiou]y$/i.test(name)) return name.slice(0,-1)+"ies";
  if(/(sh|ch|x|z)$/.test(name)) return name+"es";
  if(!name.endsWith("s")) return name+"s"; // lemon→lemons, egg→eggs, avocado→avocados
  return name; // already ends in s (or uncountable caught above)
}

// Strip noise from an ingredient string to get a canonical display name
function cleanName(s){
  return s
    .replace(/\([^)]*\)/g,"")            // "(6 oz each)" → ""
    .replace(/,.*$/,"")                   // ", diced and minced" → ""
    .replace(/\b(to serve|to top|for topping|for serving|of choice|as needed|to taste)\b.*/gi,"")
    .replace(/^(large|medium|small|fresh|frozen|ripe|raw|cooked|canned|dried|chopped|rolled|instant|quick|old.fashioned)\s+/gi,"")
    .replace(/\bvanilla\s+extract\b/gi,"vanilla")   // vanilla extract ≡ vanilla
    .replace(/\brolled\s+oats?\b/gi,"oats")         // rolled oats ≡ oats
    .trim().toLowerCase().replace(/\s+/g," ");
}

function parseIngredient(text){
  const m=text.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?)\s*(.*)$/);
  if(!m){
    const n=cleanName(text);
    return {qty:null, unit:"", displayName:n, canon:singular(n)};
  }
  let rest=m[2], unit="";
  const w=rest.match(/^([a-zA-Z]+)\b/);
  if(w && UNIT_SET.has(w[1].toLowerCase())){
    unit=unitNorm(w[1].toLowerCase()); rest=rest.slice(w[0].length);
  }
  const displayName=cleanName(rest), canon=singular(displayName);
  return {qty:parseQty(m[1]), unit, displayName, canon};
}

function category(name){
  const has=(...w)=>w.some(x=>name.includes(x));
  if(has("chicken","turkey","beef","salmon","tuna","shrimp","tofu","tempeh","fillet","meatball")) return "Meat & fish";
  if(has("egg","milk","yogurt","feta","cheese","mozzarella","parmesan","cream","butter","hummus","cottage")) return "Dairy & eggs";
  if(has("lemon","lime","tomato","cucumber","onion","garlic","ginger","spinach","kale","green","avocado",
         "banana","berry","broccoli","pepper","basil","parsley","dill","thyme","rhubarb","arugula",
         "romaine","mushroom","carrot","zucchini","asparagus","olive","edamame","vegetable")) return "Produce";
  if(has("oat","chia","flour","pasta","rice","quinoa","broth","oil","vinegar","syrup","honey","sugar",
         "baking","vanilla","soy","tamari","sesame","breadcrumb","marinara","bean","chickpea","tortilla",
         "granola","almond","nut","seed","protein","paprika","cumin","oregano","cinnamon","dressing",
         "pesto","salt","spice","crumb")) return "Pantry";
  return "Other";
}

// Format a final item for display — handles plurals, unit display, capitalisation
function fmtItem(qty,unit,displayName){
  if(qty==null||qty===0) return cap(displayName);
  const q=pretty(qty);
  if(unit) return `${q} ${unitDisplay(unit,qty)} ${displayName}`;
  return `${q} ${pluralName(displayName,qty)}`;
}

/* ---- unit conversion for aggregation ----
   Volume items accumulate in ml, weight in g, countable in their own bucket.
   This means "1/4 cup + 1 tbsp maple syrup" → 5 tbsp maple syrup. */
const VOL_TO_ML={tsp:4.93,tbsp:14.79,cup:236.59,ml:1,l:1000};
const WT_TO_G={g:1,kg:1000,oz:28.35,lb:453.59};
function mlToBest(ml){
  if(ml>=177) return {qty:ml/236.59, unit:"cup"};   // ≥ 3/4 cup
  if(ml>=29)  return {qty:ml/14.79,  unit:"tbsp"};  // ≥ 2 tbsp
  return            {qty:ml/4.93,   unit:"tsp"};
}
function gToBest(g){
  if(g>=454) return {qty:g/453.59, unit:"lb"};
  if(g>=28)  return {qty:g/28.35,  unit:"oz"};
  return           {qty:g,         unit:"g"};
}

function buildShoppingList(){
  const order=["Produce","Meat & fish","Dairy & eggs","Pantry","Other"];
  // key = cat|canon (NO unit) — volumes and weights convert to common base
  const bag={}, cats={}; order.forEach(c=>cats[c]=[]); let mealCount=0;
  Object.keys(S.plan).forEach(day=>{
    ["breakfast","lunch","dinner","salad"].forEach(meal=>{
      (S.plan[day]?.[meal]||[]).forEach(entry=>{
        mealCount++;
        const r=entry.recipe||{}, base=r.servings||entry.servings||1;
        const factor=entry.servings/base;
        (r.ingredients||[]).forEach(line=>{
          const p=parseIngredient(line);
          if(!p.canon) return;
          const cat=category(p.canon);
          const k=`${cat}|${p.canon}`;             // unit excluded from key
          if(!bag[k]) bag[k]={cat, displayName:p.displayName, volMl:0, wtG:0, count:0,
                               hasVol:false, hasWt:false, hasCount:false, noQty:false};
          if(p.qty==null){ bag[k].noQty=true; return; }
          const q=p.qty*factor;
          const vRate=VOL_TO_ML[p.unit], wRate=WT_TO_G[p.unit];
          if(vRate)      { bag[k].volMl+=q*vRate; bag[k].hasVol=true; }
          else if(wRate) { bag[k].wtG  +=q*wRate; bag[k].hasWt=true;  }
          else           { bag[k].count+=q;        bag[k].hasCount=true; }
        });
      });
    });
  });
  Object.entries(bag).forEach(([k,v])=>{
    if(!v.displayName) return;
    let label;
    if(v.hasVol)      { const b=mlToBest(v.volMl); label=fmtItem(b.qty,b.unit,v.displayName); }
    else if(v.hasWt)  { const b=gToBest(v.wtG);    label=fmtItem(b.qty,b.unit,v.displayName); }
    else if(v.hasCount){ label=fmtItem(v.count,"",v.displayName); }
    else              { label=cap(v.displayName); }
    (cats[v.cat]=cats[v.cat]||[]).push({k,label,name:v.displayName});
  });
  order.forEach(c=>cats[c].sort((a,b)=>a.name.localeCompare(b.name)));
  return {cats,order,mealCount};
}

/* ---------------- renderers ---------------- */
/* Photos: we try the blog's own image first (works in a normal browser), then
   a public image proxy if the blog blocks hotlinking, then a tasteful inline
   placeholder that always renders. Sandboxed in-app file previews block ALL
   external images, so there you'll see the placeholder — open in a real browser
   (or run server.js) to get the real photos. */
function proxyImg(url,w){
  if(!url) return url;
  const full = url.replace(/-\d+x\d+(?=\.(jpe?g|png|webp))/i,"");
  const noScheme = full.replace(/^https?:\/\//,"");
  // API===null means file:// mode (no server). API==="" means running on the server.
  if(API !== null) return `/img?url=${encodeURIComponent(full)}`;
  return `https://wsrv.nl/?url=ssl:${noScheme}&w=${w||800}&fit=cover`;
}
function placeholder(title,blog,noText){
  const t=(title||"Recipe").replace(/&/g,"and");
  // noText: gradient + ring only (used where a caption already shows the title,
  // e.g. the recipe detail hero — otherwise the name would print twice).
  const words = noText ? "" :
    "<text x='400' y='398' font-family='Georgia,serif' font-size='40' fill='#2E4429' text-anchor='middle'>"+t+"</text>"+
    (blog?"<text x='400' y='444' font-family='Georgia,serif' font-size='24' fill='#C2693F' text-anchor='middle'>"+blog+"</text>":"");
  const svg="<svg xmlns='http://www.w3.org/2000/svg' width='800' height='600'>"+
    "<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>"+
    "<stop offset='0' stop-color='#EAF0DF'/><stop offset='.55' stop-color='#F1E3CF'/>"+
    "<stop offset='1' stop-color='#E6C2AC'/></linearGradient></defs>"+
    "<rect width='800' height='600' fill='url(#g)'/>"+
    "<circle cx='400' cy='250' r='60' fill='none' stroke='#3F5C3A' stroke-width='6' opacity='.5'/>"+
    words+
    "</svg>";
  return "data:image/svg+xml;utf8,"+encodeURIComponent(svg).replace(/'/g,"%27");
}
function imgFallback(el){
  const step=+(el.dataset.step||0);
  if(step===0){ el.dataset.step="1"; el.src=el.dataset.proxied; }      // try proxy
  else { el.onerror=null; el.src=el.dataset.ph; }                       // give up -> placeholder
}
function imgEl(src,title,cls,w,blog,noText){
  const ph=placeholder(title,blog,noText);
  if(!src) return `<img class="${cls}" src="${ph}" alt="${title}">`;
  return `<img class="${cls}" loading="lazy" src="${src}" data-proxied="${proxyImg(src,w)}" data-ph="${ph}" onerror="imgFallback(this)" alt="${title}">`;
}

/* ── Spin-to-cook slot machine ───────────────────────────────────────────────
   Three reels (protein / veggie / pantry) built from ingredients that actually
   appear in the library, so every combination maps to real recipes. Reels can
   be locked, or set directly via their dropdowns; SPIN randomizes the rest.
   Results rank live by how many selected ingredients each recipe uses. */
const SLOT_VOCAB = {
  p:{em:"🥩",label:"Protein",words:["chicken","ground turkey","turkey","beef","salmon","shrimp","tuna","egg","tofu","chickpeas","black beans","lentils","cottage cheese","greek yogurt","pork"]},
  v:{em:"🥦",label:"Veggie", words:["spinach","broccoli","zucchini","bell pepper","tomato","cucumber","kale","cauliflower","mushroom","avocado","sweet potato","corn","carrot","green beans","onion"]},
  k:{em:"🧺",label:"Pantry", words:["rice","pasta","quinoa","feta","mozzarella","parmesan","tortilla","oats","peanut butter","pesto","coconut milk","honey","lemon","garlic","soy sauce"]}
};
const SLOT = { sel:{p:null,v:null,k:null}, locked:{p:false,v:false,k:false}, pool:[] };

function slotIngRx(w){ // word-boundary match w/ simple plural: "egg" hits "eggs" not "eggplant"
  return new RegExp("\\b"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(e?s)?\\b","i");
}
function slotPool(){
  const seen=new Set(), pool=[];
  const push=r=>{ if(!r||!r.title||!(r.ingredients||[]).length) return;
    const k=recipeKey(r); if(seen.has(k)) return; seen.add(k); pool.push(r); };
  Object.values(DEMO).forEach(list=>(list||[]).forEach(push));
  Object.values(S.library||{}).forEach(push);
  Object.values(S.savedRecipes||{}).forEach(push);
  Object.values(S.favouriteRecipes||{}).forEach(push);
  return pool;
}
function slotMatches(r,sel){
  const ing=(r.ingredients||[]).join(" ");
  return Object.values(sel).filter(w=>w && slotIngRx(w).test(ing)).length;
}
function slotShowable(){
  // exactly the set results can display (photo rule matches the menus)
  return window._serverAnswered ? SLOT.pool.filter(r=>r.image||r.thumb) : SLOT.pool;
}
function slotOptions(kind){
  // only offer ingredients that hit ≥1 recipe results can actually SHOW —
  // otherwise a reel can land on something guaranteed to find nothing
  const pool = slotShowable();
  return SLOT_VOCAB[kind].words.filter(w=>pool.some(r=>slotIngRx(w).test((r.ingredients||[]).join(" "))));
}
function drawSlots(){
  S.view="cook"; setNav(); S.meal=null; S.fromSlots=false;
  window.scrollTo(0,0); // always open at the top (reels first, results below)
  SLOT.pool = slotPool();
  for(const k of ["p","v","k"]) if(!SLOT.sel[k]){ const o=slotOptions(k); SLOT.sel[k]=o[Math.floor(Math.random()*o.length)]||null; }
  app.innerHTML=`
   <div class="back" onclick="home()">← back</div>
   <section class="hero fade"><h1 class="display">Spin to <span class="italic">cook</span> 🎰</h1>
   <p>Lock what you must use, spin the rest — recipes that match appear below.</p></section>
   <div class="reels">
     ${["p","v","k"].map(k=>`
       <div class="reel ${SLOT.locked[k]?"locked":""}" id="reel-${k}">
         <button class="lockbtn" onclick="slotLock('${k}')" aria-label="lock">${SLOT.locked[k]?"🔒":"🔓"}</button>
         <div class="r-em">${SLOT_VOCAB[k].em}</div>
         <select onchange="slotSet('${k}',this.value)">
           ${slotOptions(k).map(w=>`<option ${w===SLOT.sel[k]?"selected":""}>${w}</option>`).join("")}
         </select>
       </div>`).join("")}
   </div>
   <button class="spin-btn" onclick="slotSpin()">SPIN 🎲</button>
   <div id="slotResults" style="margin-top:20px"></div>`;
  slotRender();
}
function slotLock(k){ SLOT.locked[k]=!SLOT.locked[k]; const el=document.getElementById("reel-"+k);
  if(el){ el.classList.toggle("locked",SLOT.locked[k]); el.querySelector(".lockbtn").textContent=SLOT.locked[k]?"🔒":"🔓"; }
  slotRender(); // locked = must-use, so the results change immediately
}
function slotSet(k,v){ SLOT.sel[k]=v; slotRender(); }
function slotSpin(){
  const free=["p","v","k"].filter(k=>!SLOT.locked[k]);
  if(!free.length){ slotRender(); return; }
  free.forEach(k=>document.getElementById("reel-"+k)?.classList.add("spinning"));
  let ticks=0;
  const iv=setInterval(()=>{
    ticks++;
    free.forEach(k=>{
      const o=slotOptions(k); const w=o[Math.floor(Math.random()*o.length)];
      SLOT.sel[k]=w; const sel=document.querySelector(`#reel-${k} select`); if(sel) sel.value=w;
    });
    if(ticks>=8){ clearInterval(iv);
      free.forEach(k=>document.getElementById("reel-"+k)?.classList.remove("spinning"));
      slotRender(); }
  },120);
}
function slotRender(){
  const out=document.getElementById("slotResults"); if(!out) return;
  const sel=SLOT.sel;
  const showable = slotShowable();
  // REQUIRED ingredients: the protein always (it anchors the dish), plus any
  // LOCKED veggie/pantry ("must use this broccoli"). Unlocked ones rank softly.
  const required = [sel.p, SLOT.locked.v?sel.v:null, SLOT.locked.k?sel.k:null].filter(Boolean);
  const scored = showable.map(r=>{
    const ing=(r.ingredients||[]).join(" ");
    if(required.some(w=>!slotIngRx(w).test(ing))) return null;
    return {r,hits:slotMatches(r,sel)};
  }).filter(x=>x && x.hits>0)
    .sort((a,b)=>b.hits-a.hits || (b.r.nutrition?.protein_g||0)-(a.r.nutrition?.protein_g||0))
    .slice(0,25);
  if(!scored.length){ out.innerHTML=`<p style="text-align:center;color:var(--ink-soft)">Nothing uses ${required.join(" + ")} together — unlock something or spin again!</p>`; return; }
  const missing=(r)=>Object.values(sel).filter(w=>w && !slotIngRx(w).test((r.ingredients||[]).join(" ")));
  out.innerHTML = `<div class="eyebrow">${scored.length} matching recipe${scored.length>1?"s":""}</div>` +
    scored.map(({r,hits},i)=>`
      <div class="slot-row" onclick="slotOpen(${i})">
        <div style="flex:1"><b>${r.title}</b><div class="meta">${r.blog||""} · 💪 ${r.nutrition?.protein_g||"?"}g</div></div>
        <div class="hit hit-${hits}">${hits===3?"uses all 3":hits===2?`missing ${missing(r)[0]||""}`:`just ${sel.p||"1 match"}`}</div>
      </div>`).join("");
  SLOT._scored = scored;
}
function slotOpen(i){
  const r=SLOT._scored?.[i]?.r; if(!r) return;
  S.course="main"; S.picks.main=r; LISTS.main=[r];
  S.fromSlots = true; // back chip returns to spin results, not a meal menu
  drawRecipe(r); window.scrollTo({top:0,behavior:"smooth"});
}

function home(){
  S.view="cook"; setNav();
  S.meal=null;S.course="main";S.picks={main:null,salad:null,dessert:null};

         <div><h3 class="display">${k[0].toUpperCase()+k.slice(1)}</h3><small>${m.sub}</small></div>

/* ── Load recipe from any URL ──────────────────────────────────────────────── */
async function loadFromUrl(){
  const input = $("recipeUrl");
  let url = input?.value?.trim();
  if(!url){ toast("Paste a recipe URL first"); input?.focus(); return; }
  if(!/^https?:\/\//i.test(url)) url = "https://" + url;

  if(API === null){
    toast("This feature needs the server — deploy to Render first!");
    return;
  }

  // Show loading screen
  app.innerHTML = `
    <div class="back" onclick="home()">← home</div>
    <div style="padding:80px 18px;text-align:center;color:var(--ink-soft)">
      <div style="font-size:40px;margin-bottom:14px">⏳</div>
      <div style="font-weight:600;margin-bottom:6px">Loading recipe…</div>
      <div style="font-size:12px;word-break:break-all;max-width:44ch;margin:0 auto;opacity:.6">${url}</div>
    </div>`;

  try{
    const resp = await fetch(`/api/recipe?url=${encodeURIComponent(url)}`);
    if(!resp.ok) throw new Error(`Server returned ${resp.status}`);
    const recipe = await resp.json();
    if(!recipe?.title) throw new Error("Couldn't find a recipe on that page — the blog may block scraping.");

    // Fill in any missing fields
    recipe.source_url = recipe.source_url || url;
    recipe.blog = recipe.blog || new URL(url).hostname.replace(/^www\./,"");
    recipe.course = recipe.course || "main";

    // Wire into the app's recipe system so log/plan all work normally
    S.meal  = S.meal  || "dinner";
    S.course = "main";
    S.picks["main"] = recipe;
    LISTS["main"] = [recipe];

    // Permanently add to the shared library (filed under the current meal tab)
    // so it shows up in the menus on both phones from now on.
    if(recipe.ingredients?.length){
      recipe.course = ["breakfast","lunch","dinner","salad"].includes(S.meal) ? S.meal : "dinner";
      recipe.added = Date.now();
      if(!S.library[recipeKey(recipe)]){
        S.library[recipeKey(recipe)] = recipe;
        save();
        toast(`Saved to your ${recipe.course} menu 📚`);
      }
    }

    drawRecipe(recipe);
    window.scrollTo({top:0, behavior:"smooth"});
  }catch(e){
    app.innerHTML = `
      <div class="back" onclick="home()">← home</div>
      <div style="padding:60px 18px;text-align:center">
        <div style="font-size:40px;margin-bottom:12px">😕</div>
        <div style="font-weight:700;font-size:18px;margin-bottom:10px">Couldn't load that recipe</div>
        <div style="font-size:13.5px;color:var(--ink-soft);max-width:40ch;margin:0 auto;line-height:1.6">${e.message}</div>
        <button onclick="home()" style="margin-top:28px;padding:13px 28px;background:var(--herb);
          color:#fff;border-radius:14px;font-weight:700;font-size:15px">Try another URL</button>
      </div>`;
  }
}

const BLOG_LABELS = {
  eatingbirdfood:      "Eating Bird Food",
  themediterraneandish:"Mediterranean Dish",
  theeastcoastkitchen: "East Coast Kitchen",
  detoxinista:         "Detoxinista",
  skinnytaste:         "Skinnytaste",
  pinchofyum:          "Pinch of Yum",
};

/* ---- protein-source detection ----
   Tests recipe title + ingredient list in priority order so a recipe only ever
   lands in one bucket. "Vegetarian" is the final fallback (covers eggs, dairy,
   legumes, grains, tofu, etc.) */
function proteinType(r){
  const t=((r.title||"")+" "+(r.ingredients||[]).join(" ")).toLowerCase();
  if(/salmon|tuna|cod|shrimp|sardine|seafood|halibut|crab|lobster|anchov|poke|clam|mussel|tilapia|haddock/.test(t)) return "seafood";
  if(/chicken|turkey|poultry/.test(t)) return "chicken";
  if(/\bbeef\b|ground beef|steak|brisket|burger|bison/.test(t)) return "beef";
  if(/\bpork\b|bacon|ham\b|prosciutto|chorizo|sausage|pork chop/.test(t)) return "pork";
  return "vegetarian";
}
const PROTEIN_OPTS=[
  {v:"",           icon:"🍽️",  label:"All"},
  {v:"seafood",    icon:"🐟",  label:"Seafood"},
  {v:"chicken",    icon:"🍗",  label:"Chicken & Turkey"},
  {v:"beef",       icon:"🥩",  label:"Beef"},
  {v:"pork",       icon:"🐷",  label:"Pork"},
  {v:"vegetarian", icon:"🌱",  label:"Vegetarian"},
];

/* ── Sort ─────────────────────────────────────────────────────────────────── */
const SORT_OPTIONS = [
  { key:null,        icon:"⇅",  label:"Default order"   },
  { key:"protein",   icon:"💪", label:"Most protein"    },
  { key:"fiber",     icon:"🌾", label:"Most fiber"      },
  { key:"time",      icon:"⏱", label:"Quickest first"  },
  { key:"calories",  icon:"🔥", label:"Fewest calories" },
  { key:"rating",    icon:"⭐", label:"Top rated"       },
];

function _parseMinutes(r){
  const t=r.times?.total||r.times?.cook||""; if(!t) return 999;
  const h=(t.match(/(\d+)\s*h/i)||[])[1]||0, m=(t.match(/(\d+)\s*min/i)||[])[1]||0;
  return (+h)*60+(+m)||999;
}
function sortList(list){
  if(!S.sortBy) return list;
  const a=[...list];
  if(S.sortBy==="protein")  return a.sort((a,b)=>(b.nutrition?.protein_g||0)-(a.nutrition?.protein_g||0));
  if(S.sortBy==="fiber")    return a.sort((a,b)=>(b.nutrition?.fiber_g||0)-(a.nutrition?.fiber_g||0));
  if(S.sortBy==="time")     return a.sort((a,b)=>_parseMinutes(a)-_parseMinutes(b));
  if(S.sortBy==="calories") return a.sort((a,b)=>(a.nutrition?.calories||9999)-(b.nutrition?.calories||9999));
  if(S.sortBy==="rating")   return a.sort((a,b)=>(b.rating?.value||0)-(a.rating?.value||0)||(b.rating?.count||0)-(a.rating?.count||0));
  if(S.sortBy==="az")       return a.sort((a,b)=>a.title.localeCompare(b.title));
  return list;
}
function _updateSortBtn(){
  const btn=$("sortBtn"); if(!btn) return;
  const opt=SORT_OPTIONS.find(o=>o.key===S.sortBy);
  btn.textContent=opt?.icon||"⇅"; btn.classList.toggle("on",!!S.sortBy);
}
function setSortBy(key){
  S.sortBy=key; document.getElementById("sort-dd")?.remove();
  _updateSortBtn(); applyFilters();
}
function toggleSortMenu(){
  const existing=document.getElementById("sort-dd");
  if(existing){ existing.remove(); return; }
  const wrap=document.getElementById("sort-wrap"); if(!wrap) return;
  const dd=document.createElement("div"); dd.id="sort-dd"; dd.className="sort-dd";
  dd.innerHTML=SORT_OPTIONS.map(o=>`
    <button class="sort-opt${S.sortBy===o.key?' on':''}" data-sk="${o.key??''}"
      onclick="setSortBy(this.dataset.sk||null)">
      <span>${o.icon}</span>${o.label}${S.sortBy===o.key?'<span class="sort-ck">✓</span>':''}
    </button>`).join("");
  wrap.appendChild(dd);
  setTimeout(()=>{
    document.addEventListener("click",function _c(e){
      if(!dd.contains(e.target)&&e.target.id!=="sortBtn"){dd.remove();document.removeEventListener("click",_c);}
    });
  },10);
}

/* ---- shared filter application ---- */
// The favourites that should appear in the current meal's menu: those present
// in the live list PLUS saved-snapshot favourites tagged to this meal. Chip
// count and the Favourites filter both use this, so they always agree.
function mealFavList(){
  const out=[], seen=new Set();
  for(const r of S.fullMenuList){
    const k=recipeKey(r);
    if(S.favourites.has(k) && !seen.has(k)){ out.push(r); seen.add(k); }
  }
  for(const key of S.favourites){
    if(seen.has(key)) continue;
    if(!S.favouriteRecipes[key]) continue;
    if(mealOfFavourite(key)!==S.meal) continue;
    out.push(S.favouriteRecipes[key]); seen.add(key);
  }
  return out;
}

function mealOfFavourite(key){
  // Which meal does this favourited recipe belong to?
  if(S.mealMoves[key]) return S.mealMoves[key];            // explicit move wins
  if(S.favouriteRecipes[key]?._meal) return S.favouriteRecipes[key]._meal; // tagged when hearted
  for(const m of ["breakfast","lunch","dinner","salad"]){  // fall back to DEMO lookup
    if((DEMO[m]||[]).some(r=>recipeKey(r)===key)) return m;
  }
  return null;
}

function applyFilters(){
  let list = S.fullMenuList;
  if(S.favFilter){
    list = mealFavList();
  }
  if(S.newFilter) list = list.filter(isNewRecipe);
  if(S.blogFilter)    list = list.filter(r=>r.blog===S.blogFilter);
  if(S.proteinFilter) list = list.filter(r=>proteinType(r)===S.proteinFilter);
  if(S.searchQuery){
    const q = S.searchQuery.toLowerCase();
    list = list.filter(r=>
      r.title.toLowerCase().includes(q) ||
      (r.blog||"").toLowerCase().includes(q) ||
      (r.ingredients||[]).some(i=>i.toLowerCase().includes(q))
    );
  }
  list = dedupeRecipes(sortList(list));
  LISTS[S.course] = list;
  const el=$("cards"); if(!el) return;
  el.innerHTML = renderCardItems(list, S.course);
}

function filterSearch(q){
  S.searchQuery = q.trim()||null;
  // Show/hide clear button
  const clr=$("searchClear"), inp=$("searchInput");
  if(clr) clr.style.display = S.searchQuery ? "flex":"none";
  if(inp && inp.value!==q) inp.value = q;
  applyFilters();
}

function isNewRecipe(r){
  return !!r.added && (Date.now() - r.added) < 7*86400000; // added in last 7 days
}
function filterNew(){
  S.newFilter = !S.newFilter;
  S.blogFilter = null;
  refreshFavChip(); refreshProteinBar(); applyFilters();
}

function filterFavourites(){
  S.favFilter = !S.favFilter;
  // Clear blog filter when toggling favourites (they compose but avoid confusion)
  S.blogFilter = null;
  refreshFavChip();
  refreshProteinBar();
  applyFilters();
}

function toggleFav(key, e){
  if(e){ e.stopPropagation(); e.preventDefault(); }
  const nowFav = !S.favourites.has(key);
  if(nowFav){
    S.favourites.add(key);
    // Snapshot the full recipe (tagged with its meal) so it survives scrape updates and deploys
    const recipe = S.picks?.[S.course] || S.fullMenuList?.find(r=>recipeKey(r)===key);
    if(recipe) S.favouriteRecipes[key] = {...recipe, _meal: S.meal};
  } else {
    S.favourites.delete(key);
    delete S.favouriteRecipes[key];
  }
  save();
  // Update any heart buttons showing this recipe
  document.querySelectorAll(`.heart-btn[data-fk]`).forEach(btn=>{
    if(btn.dataset.fk===key){ btn.textContent=nowFav?'❤️':'🤍'; btn.classList.toggle('active',nowFav); }
  });
  // Update the detail page heart if open
  const dh=document.querySelector('.detail-heart');
  if(dh && dh.dataset.fk===key){ dh.textContent=nowFav?'❤️':'🤍'; dh.classList.toggle('active',nowFav); }
  refreshFavChip();
}

function refreshFavChip(){
  const fb=$("filter-bar"); if(!fb||!S.fullMenuList.length) return;
  const favCount=mealFavList().length;
  const newCount=S.fullMenuList.filter(isNewRecipe).length;
  const blogs=[...new Set(S.fullMenuList.map(r=>r.blog).filter(Boolean))];
  fb.innerHTML=[
    favCount>0?`<button class="chip${S.favFilter?' fav-active':''}" onclick="filterFavourites()">❤️ Favourites<span class="chip-cnt">${favCount}</span></button>`:"",
    newCount>0?`<button class="chip${S.newFilter?' fav-active':''}" onclick="filterNew()">🆕 New<span class="chip-cnt">${newCount}</span></button>`:"",
    `<button class="chip" data-blog="" aria-pressed="${!S.blogFilter&&!S.favFilter&&!S.newFilter}" onclick="filterBlog('')">All</button>`,
    ...blogs.map(b=>`<button class="chip" data-blog="${b}" aria-pressed="${S.blogFilter===b}" onclick="filterBlog('${b}')">${BLOG_LABELS[b]||b}</button>`)
  ].filter(Boolean).join("");
}

/* Rebuild protein chips with live counts against the blog-filtered base list.
   Chips with 0 matching recipes are hidden so the bar stays clean. */
function refreshProteinBar(){
  const pb=$("protein-bar"); if(!pb) return;
  const base = S.blogFilter ? S.fullMenuList.filter(r=>r.blog===S.blogFilter) : S.fullMenuList;
  pb.innerHTML = PROTEIN_OPTS.map(o=>{
    const cnt = o.v ? base.filter(r=>proteinType(r)===o.v).length : base.length;
    if(o.v && cnt===0) return ""; // hide if no recipes in this category/blog combo
    const active = (o.v||"")===(S.proteinFilter||"");
    return `<button class="chip" data-protein="${o.v}" aria-pressed="${active}" onclick="filterProtein('${o.v}')">${o.icon} ${o.label}<span class="chip-cnt">${cnt}</span></button>`;
  }).join("");
}

function filterBlog(blog){
  S.blogFilter = blog || null;
  document.querySelectorAll("#filter-bar .chip").forEach(c=>
    c.setAttribute("aria-pressed", String(c.dataset.blog===(blog||""))));
  // If the active protein filter has 0 hits in the new blog, auto-clear it
  if(S.proteinFilter){
    const base = S.blogFilter ? S.fullMenuList.filter(r=>r.blog===S.blogFilter) : S.fullMenuList;
    if(!base.some(r=>proteinType(r)===S.proteinFilter)) S.proteinFilter = null;
  }
  refreshProteinBar();
  applyFilters();
}

function filterProtein(protein){
  S.proteinFilter = protein || null;
  document.querySelectorAll("#protein-bar .chip").forEach(c=>
    c.setAttribute("aria-pressed", String(c.dataset.protein===(protein||""))));
  applyFilters();
}

// Renders just the card HTML (used by applyFilters + renderCards)
function renderCardItems(list, course){

        <div style="font-size:36px;margin-bottom:10px">🤍</div>

    const parts=[

    ].filter(Boolean);
    const why=parts.join(" + ")||"this category";
    return `<div style="grid-column:1/-1;padding:30px 2px;color:var(--ink-soft);font-style:italic">No ${why} recipes — try a different filter.</div>`;
  }

      <div class="card-img-wrap">

        <button class="heart-btn${isFav?' active':''}" data-fk="${key.replace(/"/g,'&quot;')}"
          onclick="toggleFav(this.dataset.fk,event)" aria-label="${isFav?'Remove from':'Save to'} favourites">
          ${isFav?'❤️':'🤍'}
        </button>
      </div>
      <div class="card-body">
        <div class="blog">${r.blog||""}</div>
        <h4>${r.title}</h4>
        <div class="pills">

          ${r.nutrition?.protein_g?`<span class="pill protein">💪 ${r.nutrition.protein_g}g protein / serving</span>`:""}
        </div>
      </div>
