// Collapse entries that are the same recipe reached by cosmetically different
// URLs (trailing slash, www, http/https) or identical titles. Display-only —
// does NOT change recipeKey or anything stored. Prefers the copy that has a photo.
function normUrl(u){
  return (u||"").trim().toLowerCase()
    .replace(/^https?:\/\//,"").replace(/^www\./,"")
    .replace(/[?#].*$/,"").replace(/\/+$/,"");
}
function dedupeRecipes(list){
  const out=[], byUrl=new Map(), byTB=new Map();
  for(const r of list){
    const u  = normUrl(r.source_url);
    // Normalize invisible differences: HTML entities, NBSP, repeated spaces —
    // they render identically on screen but would defeat a naive comparison.
    const normT = t => (t||"").toLowerCase()
      .replace(/&[#a-z0-9]+;/g," ").replace(/[\u00a0\s]+/g," ")
      .replace(/[^a-z0-9 ]/g,"").trim();
    const tb = normT(r.blog)+"|"+normT(r.title);
    // Same normalized URL OR same blog+title = same recipe (different slugs
    // for one dish happen when the feed and the scraper disagree on the URL).
    const tbEmpty = tb.endsWith("|");
    let prevIdx = (u && byUrl.has(u)) ? byUrl.get(u)
                : (!tbEmpty && byTB.has(tb)) ? byTB.get(tb) : undefined;
    if(prevIdx===undefined){
      const idx=out.length; out.push(r);
      if(u) byUrl.set(u,idx);
      if(!tbEmpty) byTB.set(tb,idx);
    }else{
      const cur=out[prevIdx];
      const curImg=!!(cur.image||cur.thumb), rImg=!!(r.image||r.thumb);
      const better =
        (!curImg && rImg) ||                                            // photo wins
        (curImg===rImg && (r.ingredients?.length||0)>(cur.ingredients?.length||0)) || // richer wins
        (curImg===rImg && (r.ingredients?.length||0)===(cur.ingredients?.length||0)
          && S.favourites.has(recipeKey(r)) && !S.favourites.has(recipeKey(cur)));    // favourited wins
      if(better){ out[prevIdx]=r; if(u) byUrl.set(u,prevIdx); if(!tbEmpty) byTB.set(tb,prevIdx); }
    }
  }
  return out;
}

function renderCards(list, course){
  list = dedupeRecipes(list);
  // Hide recipes with no photo — BUT only once the server has actually answered
  // with image data. If the server is down/slow, hiding here would blank ~90% of
  // the library (photos are server-supplied), so we show everything until then.
  if(window._serverAnswered){
    list = list.filter(r => r.image || r.thumb);
  }
  S.fullMenuList = list; S.blogFilter = null; S.proteinFilter = null;
  LISTS[course] = list;
  refreshFavChip();
  refreshProteinBar();
  const el = $("cards") || app;
  el.innerHTML = renderCardItems(list, course);
  el._list = list;
}

// Per-meal menu state cache: preserves list, filters and scroll position
// so hitting back from a recipe instantly returns to the exact spot.
// Cleared for a meal when she navigates back to the home screen.
const _menuMem = {};

let LISTS={};
function openPlanRecipe(day, meal, key){
  const entry=(S.plan[day]?.[meal]||[]).find(e=>e.key===key);
  let r=entry?.recipe || findRecipeByKey(key);
  // Fall back to a saved favourite snapshot if the recipe is missing details
  if((!r||!r.ingredients) && S.favouriteRecipes[key]?.ingredients) r=S.favouriteRecipes[key];
  if(!r){ toast("Recipe details unavailable"); return; }
  S.recipeOrigin="plan";
  S.meal=meal; S.course="main"; S.picks["main"]=r;
  drawRecipe(r);
  window.scrollTo({top:0,behavior:"smooth"});
  fetchLiveNutrition(r);
}

async function openRecipe(course,i){
  // Save full menu state before leaving so we can restore it on back
  if(S.meal){
    _menuMem[S.meal] = {
      list:        S.fullMenuList.slice(),
      blogFilter:  S.blogFilter,
      proteinFilter: S.proteinFilter,
      searchQuery: S.searchQuery,
      favFilter:   S.favFilter,
      newFilter:   S.newFilter,
      sortBy:      S.sortBy,
      scrollY:     window.scrollY,
    };
  }
  const list = course==="main" ? (DEMO[S.meal]) : DEMO[course];
  let r = (LISTS[course]||list)[i];
  if(!r) return;

  // If recipe has no ingredients, check saved favouriteRecipes first (survives scrape wipes)
  if(!r.ingredients){
    const savedKey = recipeKey(r);
    if(S.favouriteRecipes[savedKey]?.ingredients){
      r = S.favouriteRecipes[savedKey];
    }
  }

  // New server-scraped recipes only have title/url/image — fetch full data before rendering
  if(!r.ingredients && r.source_url && API !== null){
    app.innerHTML=`
      ${S.fromSlots
        ? `<div class="back" onclick="S.fromSlots=false;drawSlots()">← spin results</div>`
        : S.meal
          ? `<div class="back" onclick="openMeal('${S.meal}')">← ${S.meal} menu</div>`
          : `<div class="back" onclick="home()">← back</div>`}
      <div style="padding:80px 18px;text-align:center;color:var(--ink-soft)">
        <div style="font-size:36px;margin-bottom:14px">⏳</div>
        <div>Loading recipe from ${r.blog||"blog"}…</div>
      </div>`;
    try{
      const resp = await fetch(`/api/recipe?url=${encodeURIComponent(r.source_url)}`);
      if(resp.ok){ const full=await resp.json(); if(full?.title) r=Object.assign({},r,full); }
    }catch{}
  }

  S.picks[course]=r; S.course=course; S.recipeOrigin="menu";

  // Keep saved copy of any favourited recipe up to date with latest full data
  const rKey = recipeKey(r);
  if(S.favourites.has(rKey) && r.ingredients){
    S.favouriteRecipes[rKey] = r;
    save();
  }

  drawRecipe(r);
  window.scrollTo({top:0,behavior:"smooth"});
  fetchLiveNutrition(r);
}

function nutriCard(v,k,hi,id){
  if(v==null) return "";
  const unit=k==="Calories"?"":"g";
  return `<div id="${id}"><div class="v ${hi?'hi':''}">${Math.round(v)}${unit}</div><div class="k">${k}</div></div>`;
}

// ── Live nutrition fetcher ────────────────────────────────────────────────────
// Keyed by source_url. Populated once per session; cleared on page reload.
const _nutCache = new Map();

async function fetchLiveNutrition(r){
  if(API === null || !r?.source_url) return;
  const url = r.source_url;

  // Already fetched this session
  if(_nutCache.has(url)){ _applyNutrition(r, _nutCache.get(url)); return; }

  // Pulse the cells while we wait
  const IDS = ["nCal","nProt","nCarbs","nFat","nFib"];
  IDS.forEach(id=>{ const el=document.getElementById(id); if(el) el.classList.add("fetching"); });

  try{
    const resp = await fetch(`/api/recipe?url=${encodeURIComponent(url)}`);
    if(!resp.ok) throw new Error(resp.status);
    const data = await resp.json();
    const n = data.nutrition;
    if(!n || typeof n !== "object") throw new Error("no nutrition");
    // Piggyback the image onto the nutrition object so _applyNutrition can use it
    if(data.image) n._image = data.image;
    _nutCache.set(url, n);
    _applyNutrition(r, n);
  }catch{
    // Cloudflare or network blocked the fetch — keep estimates, stop pulsing
    IDS.forEach(id=>{ const el=document.getElementById(id); if(el) el.classList.remove("fetching"); });
    const src=document.getElementById("nutri-source");
    if(src) src.innerHTML = API !== null
      ? "⚠️ Estimated nutrition · this blog's security prevents live fetching"
      : "⚠️ Estimated nutrition · deploy server for live data";
  }
}

function _applyNutrition(r, n){
  // Merge live values onto the static ones, but never let a blank or zero
  // fetched value wipe out a good baked-in number (e.g. when a blog is
  // Cloudflare-blocked and the server returns empty/zero nutrition).
  const merged = Object.assign({}, r.nutrition || {});
  for(const k of ["calories","protein_g","carbs_g","fat_g","fiber_g"]){
    const v = n[k];
    if(typeof v === "number" && isFinite(v) && v > 0) merged[k] = v;
  }
  r.nutrition = merged;

  // Update nutrition grid cells from the merged values
  const cells = [
    ["nCal",   merged.calories,   "Calories", false],
    ["nProt",  merged.protein_g,  "Protein",  true ],
    ["nCarbs", merged.carbs_g,    "Carbs",    false],
    ["nFat",   merged.fat_g,      "Fat",      false],
    ["nFib",   merged.fiber_g,    "Fiber",    false],
  ];
  cells.forEach(([id, val, label, hi])=>{
    const el = document.getElementById(id); if(!el || val==null) return;
    const unit = label==="Calories" ? "" : "g";
    el.classList.remove("fetching");
    el.innerHTML = `<div class="v ${hi?'hi':''}">${Math.round(val)}${unit}</div><div class="k">${label}</div>`;
  });

  // Update image if the recipe was missing one
  if(!r.image && n._image){
    r.image = n._image;
    const heroImg = document.querySelector(".r-hero img");
    if(heroImg){ heroImg.src = proxyImg(n._image, 1000); heroImg.style.display="block"; }
  }
  // Update source indicator
  const src = document.getElementById("nutri-source");
  if(src) src.innerHTML = "✓ Live nutrition from " + (r.blog||"blog");
  const prot = Math.round(r.nutrition?.protein_g || 0);
  const metaProt = document.getElementById("metaProt");
  if(metaProt) metaProt.innerHTML = `💪 <b>${prot}g</b> protein / serving`;
  // Always sync the log button with live protein — overrides any 'calculating…' or wrong estimate
  const btn = document.getElementById("addbtn");
  if(btn){
    const logged = S.added.has(recipeKey(r));
    const label = prot > 0 ? `${prot}g protein` : `0g protein`;
    btn.textContent = logged
      ? `✓ Logged one serving · ${label} today`
      : `＋ Log one serving · ${label}`;
  }
  // Also sync S.picks so addProtein() logs the correct value when clicked
  if(S.picks){
    for(const course of Object.keys(S.picks)){
      if(S.picks[course] && recipeKey(S.picks[course])===recipeKey(r)){
        S.picks[course].nutrition = r.nutrition;
      }
    }
  }
}

/* ---------------- ingredient scaling ---------------- */
function rescale(dir){
  S.servings = Math.max(1, (S.servings||1) + dir);
  drawRecipe(S.picks[S.course]);

const gcd=(a,b)=>b?gcd(b,a%b):a;
// parse "1", "1.5", "1/2", "1 1/2" -> number
function parseQty(s){
  s=s.trim();
  if(/^\d+\s+\d+\/\d+$/.test(s)){ const [w,f]=s.split(/\s+/); const [a,b]=f.split("/"); return +w + (+a)/(+b); }
  if(/^\d+\/\d+$/.test(s)){ const [a,b]=s.split("/"); return (+a)/(+b); }
  return parseFloat(s);
}
// number -> friendly cooking amount: "2", "1 1/2", "3/4", "1/3"
function pretty(x){
  if(!isFinite(x)) return "";
  if(x < 0.05) return "0";
  const whole = Math.floor(x + 1e-9);
  let frac = x - whole;
  // common cooking fractions, including thirds
  const table=[[0,""],[1/8,"1/8"],[1/4,"1/4"],[1/3,"1/3"],[3/8,"3/8"],[1/2,"1/2"],
               [5/8,"5/8"],[2/3,"2/3"],[3/4,"3/4"],[7/8,"7/8"],[1,""]];
  let best=table[0], bestD=1;
  for(const t of table){ const d=Math.abs(frac-t[0]); if(d<bestD){bestD=d;best=t;} }
  if(best[0]===1) return String(whole+1);              // rounded up to next whole
  if(best[1]==="") return String(whole||0);            // no fractional part
  return whole ? `${whole} ${best[1]}` : best[1];
}
// scale only the leading quantity of an ingredient line; leave the text alone
function scaleIngredient(text, factor){
  const m = text.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?)(\s.*)?$/);
  if(!m) return text;                  // no leading number (e.g. "salt and pepper")
  const val = parseQty(m[1]) * factor;
  return pretty(val) + (m[2]||"");
}

/* ---------------- protein logging (per serving = one person) ---------------- */
function addProtein(){
  const r=S.picks[S.course]; if(!r) return;
  const key=recipeKey(r), grams=r.nutrition?.protein_g||0, d=today();
  S.log[d]=S.log[d]||[];
  if(S.added.has(key)){
    S.added.delete(key);
    const i=S.log[d].findIndex(e=>e.key===key); if(i>=0) S.log[d].splice(i,1);
    toast(`Removed ${grams}g`);
  } else {
    S.added.add(key);
    const n=r.nutrition||{};
    S.log[d].push({meal:S.meal,course:S.course,title:r.title,blog:r.blog,key,
      protein:Math.round(n.protein_g||0), calories:Math.round(n.calories||0),
      carbs:Math.round(n.carbs_g||0), fat:Math.round(n.fat_g||0), fiber:Math.round(n.fiber_g||0)});
    toast(`Logged one serving · ${grams}g protein 💪`);
  }
  const b=$("addbtn");if(b){const on=S.added.has(key);
    b.className="addbtn"+(on?" done":"");
    b.innerHTML=on?`✓ Logged one serving · ${grams}g protein today`:`＋ Log one serving · ${grams}g protein`;}
  refreshCoach(); save();
}

function moveRecipe(targetMeal){
  const r=S.picks[S.course]; if(!r||!targetMeal) return;
  const key=recipeKey(r);
  const fromMeal=S.meal;
  // Record the reassignment and snapshot the full recipe so it always renders
  S.mealMoves[key]=targetMeal;
  S.movedRecipes[key]=r;
  // Clear cached menu lists so both meals rebuild fresh next time they open
  if(_menuMem[fromMeal]) delete _menuMem[fromMeal];
  if(_menuMem[targetMeal]) delete _menuMem[targetMeal];
  save();
  const label=targetMeal.charAt(0).toUpperCase()+targetMeal.slice(1);
  toast(`Moved to ${MEALS[targetMeal].emoji} ${label}`);
  // Re-render the move section so the buttons update to exclude the new meal
  S.meal=targetMeal;
  drawRecipe(r);
}

async function shareRecipe(){
  const r=S.picks[S.course]; if(!r) return;
  const n=r.nutrition||{};
  // Build a tidy text summary of the recipe
  const lines=[];
  lines.push(r.title);
  if(r.blog) lines.push("via "+(BLOG_LABELS[r.blog]||r.blog));
  if(r.times?.total) lines.push("⏱ "+r.times.total);
  if(n.protein_g) lines.push(`💪 ${Math.round(n.protein_g)}g protein${n.calories?` · ${Math.round(n.calories)} cal`:""} per serving`);
  if(Array.isArray(r.ingredients)&&r.ingredients.length){
    lines.push("\nIngredients:");
    r.ingredients.forEach(i=>lines.push("• "+i));
  }
  const steps=r.instructions?.[0]?.steps;
  if(Array.isArray(steps)&&steps.length){
    lines.push("\nInstructions:");
    steps.forEach((st,i)=>lines.push(`${i+1}. ${st}`));
  }
  if(r.source_url) lines.push("\nFull recipe: "+r.source_url);
  lines.push("\nShared from Morgan's Kitchen");
  const text=lines.join("\n");

  const shareData={title:r.title, text};
  if(r.source_url) shareData.url=r.source_url;

  try{
    if(navigator.share){
      await navigator.share(shareData);   // brings up the native phone share sheet
      return;
    }
  }catch(e){
    if(e?.name==="AbortError") return;    // user dismissed the sheet — do nothing
  }
  // Fallback for browsers without Web Share (e.g. desktop): copy to clipboard
  try{
    await navigator.clipboard.writeText(text);
    toast("Recipe copied to clipboard 📋");
  }catch{
    toast("Couldn't share on this device");
  }
}

/* ── Water reminder ─────────────────────────────────────────────────────────── */
function fmtTime(t){
  if(!t) return "";
  const [h,m]=t.split(':').map(Number);
  return `${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`;
}

let _waterTimer=null;

async function toggleWaterReminder(){
  if(S.goals.reminderEnabled){
    S.goals.reminderEnabled=false;
    clearTimeout(_waterTimer); _waterTimer=null;
    save(); renderGoals(); toast("Water reminder off."); return;
  }
  if(!('Notification' in window)){
    toast("Notifications aren't supported on this browser."); return;
  }
  const perm = Notification.permission==="granted"
    ? "granted"
    : await Notification.requestPermission();
  if(perm!=="granted"){
    toast("Allow notifications in Settings to enable reminders."); return;
  }
  S.goals.reminderEnabled=true;
  save(); scheduleWaterReminder(); renderGoals();
  toast(`💧 Reminder set for ${fmtTime(S.goals.reminderTime||'14:00')} daily!`);
}

function setReminderTime(t){
  S.goals.reminderTime=t; save();
  if(S.goals.reminderEnabled) scheduleWaterReminder();
}

function scheduleWaterReminder(){
  clearTimeout(_waterTimer); _waterTimer=null;
  if(!S.goals.reminderEnabled) return;
  const [h,m]=(S.goals.reminderTime||"14:00").split(':').map(Number);
  const now=new Date(), next=new Date(now);
  next.setHours(h,m,0,0);
  if(next<=now) next.setDate(next.getDate()+1);
  _waterTimer=setTimeout(()=>{
    _fireWaterReminder();
    _waterTimer=setInterval(_fireWaterReminder, 24*60*60*1000);
  }, next-now);
}

function _fireWaterReminder(){
  if(!S.goals.reminderEnabled || Notification.permission!=="granted") return;
  const water=(S.waterToday||{})[today()]||0;
  const goal=S.goals.water||8;
  if(water>=goal) return; // already hit goal today
  const remaining=goal-water;
  const body=water===0
    ? `You haven't logged any water yet today. Goal: ${goal} glasses 💧`
    : `${water}/${goal} glasses so far — ${remaining} more to go!`;
  const opts={body, icon:'/apple-touch-icon.jpg', badge:'/apple-touch-icon.jpg',
               tag:'water-reminder', requireInteraction:false};
  if(navigator.serviceWorker?.controller){
    navigator.serviceWorker.controller.postMessage({type:'WATER_NOTIF',title:'💧 Time to hydrate!', ...opts});
  } else {
    new Notification('💧 Time to hydrate!', opts);
  }
}

function logWater(dir){
  const d=today();
  S.waterToday=S.waterToday||{};
  S.waterToday[d]=Math.max(0,(S.waterToday[d]||0)+dir);

  const pct=Math.min(100,Math.round(w/g*100));
  const v1=document.getElementById('gv-water'), v2=document.getElementById('gv-water2');
  const bar=document.getElementById('gf-water');
  if(v1) v1.textContent=w; if(v2) v2.textContent=w; if(bar) bar.style.width=pct+'%';
}

/* ---- plan drag and drop (pointer events: works for touch + mouse) ---- */
let _planDrag=null;
function initPlanDrag(){
  if(window._planDragInit) return;
  window._planDragInit=true;
  app.addEventListener("pointerdown", planPointerDown);
}
function planPointerDown(e){
  const handle=e.target.closest(".drag-handle");
  if(!handle) return;
  const item=handle.closest(".plan-item");
  if(!item) return;
  if(e.pointerType==="mouse" && e.button!==0) return;  // left button only
  e.preventDefault();
  const rect=item.getBoundingClientRect();
  _planDrag={
    key:item.dataset.key, srcDay:item.dataset.day, srcMeal:item.dataset.meal,
    offX:e.clientX-rect.left, offY:e.clientY-rect.top, target:null, item,
    lastX:e.clientX, lastY:e.clientY
  };
  const ghost=item.cloneNode(true);
  ghost.classList.add("drag-ghost");
  ghost.style.width=rect.width+"px";
  ghost.style.left=rect.left+"px";
  ghost.style.top=rect.top+"px";
  document.body.appendChild(ghost);
  _planDrag.ghost=ghost;
  item.classList.add("drag-source");
  // Revealing all the empty drop slots adds height ABOVE the grabbed item, which would
  // otherwise shove it off-screen (the "jumps up to Monday" bug). Measure the shift and
  // compensate the scroll so the item stays exactly under the finger.
  const beforeTop=item.getBoundingClientRect().top;
  app.classList.add("dragging");
  const afterTop=item.getBoundingClientRect().top;
  if(afterTop!==beforeTop) window.scrollBy(0, afterTop-beforeTop);
  document.addEventListener("pointermove", planPointerMove);
  document.addEventListener("pointerup", planPointerUp);
  document.addEventListener("pointercancel", planPointerUp);
}
function _planUpdateTarget(x,y){
  if(!_planDrag) return;
  const el=document.elementFromPoint(x,y);
  const slot=el?.closest(".plan-meal");
  document.querySelectorAll(".plan-meal.drop-target").forEach(s=>{if(s!==slot)s.classList.remove("drop-target");});
  if(slot){ slot.classList.add("drop-target"); _planDrag.target=slot; }
  else { _planDrag.target=null; }
}
let _planScrollVel=0,_planScrollRAF=null;
function _planAtTop(){ return window.scrollY<=0; }
function _planAtBottom(){ return (window.innerHeight+window.scrollY) >= (document.documentElement.scrollHeight-2); }
function _planAutoScroll(){
  if(!_planDrag||!_planScrollVel){ _planScrollRAF=null; return; }
  // Stop at the page boundaries so it never spins uselessly (which blocked drops near the ends)
  if((_planScrollVel<0&&_planAtTop())||(_planScrollVel>0&&_planAtBottom())){ _planScrollVel=0; _planScrollRAF=null; return; }
  window.scrollBy(0,_planScrollVel);
  _planUpdateTarget(_planDrag.lastX,_planDrag.lastY);
  if(_planDrag.ghost) _planDrag.ghost.style.top=(_planDrag.lastY-_planDrag.offY)+"px";
  _planScrollRAF=requestAnimationFrame(_planAutoScroll);
}
function planPointerMove(e){
  if(!_planDrag) return;
  e.preventDefault();
  _planDrag.lastX=e.clientX; _planDrag.lastY=e.clientY;
  _planDrag.ghost.style.left=(e.clientX-_planDrag.offX)+"px";
  _planDrag.ghost.style.top=(e.clientY-_planDrag.offY)+"px";
  _planUpdateTarget(e.clientX,e.clientY);
  // Auto-scroll bands sit above the home indicator / below the header so they're easy to
  // reach. When there's more page in that direction, dragging into the band scrolls; the
  // boundary guards keep the end-of-week slots droppable.
  const TOP_EDGE=100, BOT_EDGE=160, SPEED=16, h=window.innerHeight;
  if(e.clientY<TOP_EDGE && !_planAtTop())            _planScrollVel=-SPEED;
  else if(e.clientY>h-BOT_EDGE && !_planAtBottom())  _planScrollVel=SPEED;
  else                                               _planScrollVel=0;
  if(_planScrollVel && !_planScrollRAF) _planScrollRAF=requestAnimationFrame(_planAutoScroll);
}
function planPointerUp(){
  document.removeEventListener("pointermove", planPointerMove);
  document.removeEventListener("pointerup", planPointerUp);
  document.removeEventListener("pointercancel", planPointerUp);
  _planScrollVel=0;
  if(!_planDrag) return;
  const slot=_planDrag.target;
  const {srcDay,srcMeal,key}=_planDrag;
  _planDrag.ghost?.remove();
  app.classList.remove("dragging");
  document.querySelectorAll(".plan-meal.drop-target").forEach(s=>s.classList.remove("drop-target"));
  const drag=_planDrag; _planDrag=null;
  if(slot){
    const dstDay=slot.dataset.day, dstMeal=slot.dataset.meal;
    if(dstDay && dstMeal && !(dstDay===srcDay && dstMeal===srcMeal)){
      movePlanEntry(srcDay,srcMeal,key,dstDay,dstMeal);
      return;
    }
  }
  drag.item?.classList.remove("drag-source");  // dropped in place — just restore
}
function movePlanEntry(srcDay,srcMeal,key,dstDay,dstMeal){
  const srcList=S.plan[srcDay]?.[srcMeal];
  if(!srcList) return;
  const idx=srcList.findIndex(e=>e.key===key);
  if(idx<0) return;
  const [entry]=srcList.splice(idx,1);
  entry.meal=dstMeal;                                  // keep the entry's meal in sync
  S.plan[dstDay]=S.plan[dstDay]||{};
  S.plan[dstDay][dstMeal]=S.plan[dstDay][dstMeal]||[];
  if(S.plan[dstDay][dstMeal].some(e=>e.key===key)){
    toast(`Already in ${cap(dstMeal)} that day`);
  } else {
    S.plan[dstDay][dstMeal].push(entry);
    toast(`Moved to ${cap(dstMeal)}`);
  }
  save();
  renderPlan();
}

async function _copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }catch{
    try{
      const ta=Object.assign(document.createElement("textarea"),
        {value:text,style:"position:fixed;opacity:0"});
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove(); return true;
    }catch{ return false; }
  }
}

function weekChartSVG(days,totals,g){
  const W=350,H=190,padL=8,padR=8,padT=22,padB=26;
  const plotH=H-padT-padB, plotW=W-padL-padR;
  const maxV=Math.max(g*1.15,...totals,1), n=days.length, slot=plotW/n, bw=Math.min(34,slot*0.6);
  const goalY=padT+plotH*(1-g/maxV);

  days.forEach((d,i)=>{
    const v=totals[i], bh=plotH*(v/maxV), x=padL+slot*i+(slot-bw)/2, y=padT+plotH-bh;
    const met=v>=g, isT=d.iso===today();
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,bh).toFixed(1)}" rx="5" fill="${met?'#3F5C3A':'#CBB89C'}"/>`;

  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Protein per day this week">

    ${bars}</svg>`;
}

  }).join("");
  app.innerHTML=`
    <div class="page-h fade"><div class="eyebrow">last 7 days</div><h2>This week</h2></div>
    <div class="summary fade"><div style="flex:1">
      <div class="big">${avg}<small> / ${g}g</small></div>
      <div class="lbl">average protein per day · hit her goal ${hit} of 7 days</div>
      <div class="pbar"><div style="width:${avgPct}%"></div></div>
    </div></div>
    <div class="chart-wrap fade">${weekChartSVG(days,totals,g)}</div>
    <h3 style="font-family:'Fraunces',serif;font-weight:600;font-size:20px;margin:26px 2px 2px">Every meal this week</h3>
    ${dayBlocks}`;
  refreshCoach();
}

(async()=>{
  // ── INSTANT: show the app immediately from localStorage ─────────────────
  const cachedProfiles = JSON.parse(localStorage.getItem("mk_profiles")||"[]");
  const profile        = getProfile();
  await loadState();   // now nearly instant — just applies localStorage
  setNav(); refreshCoach();
  if(S.goals.reminderEnabled) scheduleWaterReminder();

  if(!profile){
    showProfilePicker(cachedProfiles);
  } else {
    try { home(); }
    catch(err){
      document.getElementById("app").innerHTML =
        "<p style='padding:40px 4px;color:#9b2c2c;font-family:Georgia,serif'>Something went wrong:<br><br>"+
        (err?.message||err)+"</p>";
    }
  }

  // ── BACKGROUND: refresh profiles list from server ─────────────────────
  if(API!==null) fetch("/api/profiles")
    .then(r=>r.ok?r.json():null)
    .then(list=>{
      if(!list?.length) return;
      localStorage.setItem("mk_profiles",JSON.stringify(list));
      // If profile picker is still visible and has new profiles, refresh it
      if(!getProfile() && document.querySelector(".ps-screen"))
        showProfilePicker(list);
    }).catch(()=>{});
})();
</script>
</body>
</html>
